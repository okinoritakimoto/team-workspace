<!--
  プロジェクトの運転席（投影） — 手で書き換えない。
  生成元の正本: 20_project/（計器盤 03_dashboard.md ほか）。
    データ層（id が dashboard-data の application/json ブロック）は tools/build_dashboard.py が正本から生成する（元の数だけ・派生値なし）。
    表示層（この HTML/CSS/JS）が達成%・実行率・必要ペース・今日までの予定・遅れ・余日・週番号・着地の見込み・持ちタスク数を計算する。
    表示層は JSON 以外を読まない（軸の上限など描画用の定数だけを持つ）。
  トークンの出所: Design DNA v2.8（dna.css）の写し — 正本ではない（正本は支援側が管理する）。
  設計（TALENT-UI-02・第5稿）: 5画面（全体・タスク・メンバー・工程表・会議）＋右からの詳細ドロワー。
    全体＝環ゲージ（いま／今日までの予定／このペースの見込み／目標）を主役に、決めどころは軽く・分析は右ドロワーへ段階開示。
    タスク＝看板 ⇄ 期限順（1行）。メンバー＝1人1枚の横長カード。工程表＝フェーズ×束×タスク×稼働を1本の時間軸（余日・遅れ）。会議＝2枚表示の横スライド＋縦の段階開示。
-->
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>プロジェクト運転席</title>
<style>
/* ============================================================
   1. トークン（Design DNA v2.8 dna.css の写し — :root 1か所）
   ============================================================ */
:root{
  --dna-bg:#ffffff; --dna-surface:#ffffff; --dna-surface-2:#f7f8fa;
  --dna-border:rgba(18,20,26,.07); --dna-border-strong:rgba(18,20,26,.13);
  --dna-hairline:#f2f3f5; --dna-hairline-crisp:rgba(18,20,26,.12); --dna-badge-bg:#ececee;
  --dna-tab-on-bg:#e8f1fa; --dna-tab-on-ink:#10395c;
  --dna-tb-face:rgba(18,90,140,.05); --dna-tb-face-hover:rgba(18,90,140,.1);
  --dna-tb-line:rgba(18,90,140,.15); --dna-tb-line-soft:rgba(18,90,140,.1);
  --dna-radius-lg:22px; --dna-radius:16px; --dna-radius-sm:10px;
  --dna-shadow:0 1px 2px rgba(16,18,26,.04),0 10px 30px rgba(16,18,26,.055);
  --dna-shadow-hover:0 2px 4px rgba(16,18,26,.05),0 16px 40px rgba(16,18,26,.09);
  --dna-ink:#191a1c; --dna-ink-2:#5c6066; --dna-ink-3:#767b82; --dna-ink-faint:#b9bcc2;
  --dna-up:#12833f; --dna-down:#d93025; --dna-link:#1a6ef5; --dna-chart:#3e83f8; --dna-chart-soft:#aac6f7; --dna-late:#c4554d;
  --dna-pill-up-bg:#e5f5eb; --dna-pill-up-ink:#0f7a39;
  --dna-pill-warn-bg:#fdf1dc; --dna-pill-warn-ink:#a05f00;
  --dna-pill-down-bg:#fdeae8; --dna-pill-down-ink:#c22b20;
  --dna-pill-info-bg:#e7effe; --dna-pill-info-ink:#1a5fd0;
  --dna-pill-neutral-bg:#eef0f2;
  --dna-chart-green:#22a04d; --dna-chart-band:#e2ebfc;
  --dna-control-on:var(--dna-link); --dna-control-off:#d4d7dc; --dna-progress-track:#eef0f3;
  --dna-grad-a:#2f7bf2; --dna-grad-b:#35c3e8;
  --dna-grad-h:linear-gradient(90deg,var(--dna-grad-a),var(--dna-grad-b));
  --dna-grad-ring:linear-gradient(135deg,var(--dna-grad-a),var(--dna-grad-b) 85%);
  --dna-btn-grad:linear-gradient(135deg,#2464ec,#0d7cad); --dna-btn-grad-ink:#ffffff;
  --dna-font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI","Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;
  --dna-fs-title:21px; --dna-fs-section:16px; --dna-fs-subject:15px; --dna-fs-body:14px; --dna-fs-sub:13.5px; --dna-fs-small:12.5px; --dna-fs-hero:27px;
  --dna-gap:16px; --dna-pad:20px 22px;
  --dna-motion-fast:.15s; --dna-motion-base:.18s; --dna-motion-slow:.34s;
  --dna-ease-out:cubic-bezier(.2,0,0,1); --dna-ease-inout:cubic-bezier(.4,0,.2,1);
  /* 描画用（page-local — 正本に無い値。意味色ではなく描画の階調） */
  --tp-ava-bg:#dfe7f5; --tp-ava-ink:#2f4a7d; --tp-grid:#eeeff2; --tp-minibar:#e6e8ee;
  --tp-bar-soft:#c9d9f6; --tp-heat:62,131,248;
  --tp-lane-shadow:0 1px 2px rgba(16,18,26,.04),0 8px 22px rgba(16,18,26,.05);
  --tp-card-shadow-hover:0 2px 4px rgba(16,18,26,.05),0 10px 24px rgba(16,18,26,.09);
  --tp-drawer-shadow:-8px 0 40px rgba(16,18,26,.16);
  --tp-scrim:rgba(18,20,26,.3);
  --tp-lane-w:minmax(0,1fr);
}
html[data-color-theme="dark"]{
  --dna-bg:#1b1c1f; --dna-surface:#232428; --dna-surface-2:#2b2c31;
  --dna-border:rgba(255,255,255,.09); --dna-border-strong:rgba(255,255,255,.16);
  --dna-hairline:rgba(255,255,255,.07); --dna-hairline-crisp:rgba(255,255,255,.12); --dna-badge-bg:#3a3b3f;
  --dna-tab-on-bg:rgba(255,255,255,.1); --dna-tab-on-ink:#e8eaed;
  --dna-tb-face:rgba(255,255,255,.08); --dna-tb-face-hover:rgba(255,255,255,.12);
  --dna-tb-line:rgba(255,255,255,.16); --dna-tb-line-soft:rgba(255,255,255,.08);
  --dna-shadow:0 1px 2px rgba(0,0,0,.3),0 12px 34px rgba(0,0,0,.35);
  --dna-shadow-hover:0 2px 4px rgba(0,0,0,.35),0 18px 44px rgba(0,0,0,.45);
  --dna-ink:#e8eaed; --dna-ink-2:#9aa0a6; --dna-ink-3:#80868b; --dna-ink-faint:#5f6368;
  --dna-up:#81c995; --dna-down:#f28b82; --dna-link:#8ab4f8; --dna-chart:#8ab4f8; --dna-chart-soft:#4a5b78; --dna-late:#f28b82;
  --dna-pill-up-bg:rgba(129,201,149,.16); --dna-pill-up-ink:#81c995;
  --dna-pill-warn-bg:rgba(253,214,99,.14); --dna-pill-warn-ink:#fdd663;
  --dna-pill-down-bg:rgba(242,139,130,.15); --dna-pill-down-ink:#f28b82;
  --dna-pill-info-bg:rgba(138,180,248,.16); --dna-pill-info-ink:#8ab4f8;
  --dna-pill-neutral-bg:rgba(255,255,255,.09);
  --dna-chart-band:rgba(138,180,248,.22);
  --dna-control-off:#4a4d52; --dna-progress-track:#2c2d31;
  --dna-grad-a:#6ba4f8; --dna-grad-b:#58c8e6;
  --dna-btn-grad:linear-gradient(135deg,#6ba4f8,#58c8e6); --dna-btn-grad-ink:#17181a;
  --tp-ava-bg:#3a4a63; --tp-ava-ink:#cdd9ee; --tp-grid:#2c2d31; --tp-minibar:#3a3b3f;
  --tp-bar-soft:#5b74a3; --tp-heat:138,180,248;
  --tp-lane-shadow:0 1px 2px rgba(0,0,0,.3),0 10px 26px rgba(0,0,0,.34);
  --tp-card-shadow-hover:0 2px 4px rgba(0,0,0,.35),0 12px 28px rgba(0,0,0,.42);
  --tp-drawer-shadow:-8px 0 48px rgba(0,0,0,.5);
  --tp-scrim:rgba(0,0,0,.5);
}

/* ============================================================
   2. 地・床（操作の床 = dna.css §10 の写し）
   ============================================================ */
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
html{background:var(--dna-bg)}
body{
  font-family:var(--dna-font);color:var(--dna-ink);background:var(--dna-bg);
  font-size:var(--dna-fs-body);font-weight:500;line-height:1.55;letter-spacing:0;
  font-feature-settings:"tnum";-webkit-font-smoothing:antialiased;overflow-x:hidden;
}
body.is-drawer{overflow:hidden}
[hidden]{display:none !important}
html[data-live] [data-sample-only]{ display:none !important; }
a{color:var(--dna-link)}
b,strong{font-weight:600}
button{font-family:inherit}
:where(button,a,input,select,textarea,[tabindex]:not([tabindex="-1"])):focus-visible{outline:2px solid var(--dna-chart);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{transition-duration:.01ms !important;animation-duration:.01ms !important}
}
mark{background:var(--dna-pill-info-bg);color:inherit;border-radius:4px;padding:0 3px;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.tp-vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
u{text-decoration:none}

/* ============================================================
   3. 器（キャンバス・題・切り替え行・脚）
   ============================================================ */
.dna-canvas{max-width:1240px;margin:0 auto;padding:22px 20px 64px;position:relative}
.tp-errband{
  display:flex;align-items:center;gap:10px;margin:0 0 14px;padding:12px 16px;border-radius:12px;
  background:var(--dna-pill-down-bg);color:var(--dna-pill-down-ink);font-size:var(--dna-fs-sub);font-weight:600;line-height:1.5;
  box-shadow:inset 0 0 0 1px rgba(194,43,32,.25);
}
body.is-broken main{display:none}
.tp-head{display:flex;align-items:flex-start;gap:16px}
.tp-head-l{flex:1 1 auto;min-width:0}
.tp-title{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:0;font-size:var(--dna-fs-title);font-weight:600;letter-spacing:.01em;line-height:1.3}
.tp-title .dna-status{font-size:12px;padding:3px 10px}
.tp-sub{margin:5px 0 0;font-size:var(--dna-fs-sub);font-weight:500;color:var(--dna-ink-3);display:flex;flex-wrap:wrap;gap:2px 0;line-height:1.5}
.tp-sub .sep{margin:0 8px;color:var(--dna-ink-faint)}
.tp-sub b{font-weight:600;color:var(--dna-ink-2)}
.tp-head-r{flex:none;display:inline-flex;align-items:center;gap:8px;padding-top:1px}
button.tp-icon{
  width:36px;height:36px;padding:0;border:1px solid var(--dna-border-strong);border-radius:var(--dna-radius-sm);background:var(--dna-surface);
  color:var(--dna-ink-2);cursor:pointer;display:inline-grid;place-items:center;box-shadow:0 1px 2px rgba(16,18,26,.04);
  transition:background var(--dna-motion-fast) ease,box-shadow var(--dna-motion-fast) ease,color var(--dna-motion-fast) ease;
}
button.tp-icon:hover{background:var(--dna-surface-2);color:var(--dna-ink);box-shadow:0 2px 6px rgba(16,18,26,.08)}
button.tp-icon:disabled{opacity:.35;cursor:default;box-shadow:none}
button.tp-icon svg{width:17px;height:17px;stroke:currentColor;fill:none}
button.tp-icon.ghost{border-color:transparent;box-shadow:none;background:transparent}
button.tp-icon.ghost:hover{background:var(--dna-surface-2)}
.tp-nav{
  display:flex;align-items:center;gap:8px 12px;flex-wrap:wrap;margin:16px 0 0;
  padding-bottom:8px;border-bottom:1px solid var(--dna-tb-line-soft);
}
.tp-nav-r{margin-left:auto;display:inline-flex;align-items:center;gap:10px;flex-wrap:wrap}
.tp-scope{display:inline-flex;align-items:center;gap:8px;font-size:var(--dna-fs-small);font-weight:600;color:var(--dna-ink-3)}
.tp-select{
  font-family:var(--dna-font);font-size:var(--dna-fs-sub);font-weight:600;color:var(--dna-ink);
  background:var(--dna-surface);border:1px solid var(--dna-border-strong);border-radius:var(--dna-radius-sm);
  padding:6px 30px 6px 10px;appearance:none;-webkit-appearance:none;max-width:220px;cursor:pointer;line-height:1.3;
  background-image:linear-gradient(45deg,transparent 50%,var(--dna-ink-3) 50%),linear-gradient(135deg,var(--dna-ink-3) 50%,transparent 50%);
  background-position:calc(100% - 15px) 55%,calc(100% - 10px) 55%;background-size:5px 5px,5px 5px;background-repeat:no-repeat;
}
.tp-select.is-on{border-color:transparent;background-color:var(--dna-surface);background-image:linear-gradient(45deg,transparent 50%,var(--dna-pill-info-ink) 50%),linear-gradient(135deg,var(--dna-pill-info-ink) 50%,transparent 50%);box-shadow:0 0 0 1.5px var(--dna-grad-a);color:var(--dna-pill-info-ink)}
.tp-foot{margin:32px 0 0;padding-top:14px;border-top:1px solid var(--dna-hairline);font-size:var(--dna-fs-small);font-weight:500;color:var(--dna-ink-3);line-height:1.7}
.tp-foot b{font-weight:600;color:var(--dna-ink-2)}
.tp-gloss-wrap{margin:0 0 8px}
.tp-glist{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:2px 24px;padding-top:2px}
.tp-glist > div{display:grid;grid-template-columns:112px minmax(0,1fr);gap:10px;padding:5px 0;border-bottom:1px solid var(--dna-hairline);font-size:13px;line-height:1.5}
.tp-glist b{font-weight:600;color:var(--dna-ink)}
.tp-glist span{color:var(--dna-ink-2);font-weight:400}
main > section{margin-top:16px}
main > section:not([hidden]){animation:tp-in var(--dna-motion-base) var(--dna-ease-out)}
@keyframes tp-in{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}

/* ============================================================
   4. DNA 部品（dna.css の該当規則を page-local へ写し・scope は .dna-canvas / .tp-drawer）
   ============================================================ */
.dna-card{
  background:var(--dna-surface);border:1px solid var(--dna-border);border-radius:var(--dna-radius);
  box-shadow:var(--dna-shadow);padding:var(--dna-pad);min-width:0;
  transition:box-shadow var(--dna-motion-base) ease;
}
.dna-card:hover{box-shadow:var(--dna-shadow-hover)}
.dna-card.is-clickable{cursor:pointer;transition:box-shadow var(--dna-motion-base) ease,border-color var(--dna-motion-fast) ease}
.dna-card.is-clickable:hover{border-color:var(--dna-chart-soft)}
.tp-ct{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;min-width:0}
.tp-ct h2,.tp-ct h3{margin:0;font-size:var(--dna-fs-section);font-weight:600;color:var(--dna-ink);line-height:1.35}
.tp-ct .sub{font-size:var(--dna-fs-small);font-weight:500;color:var(--dna-ink-3)}
.tp-ct .right{margin-left:auto;display:inline-flex;align-items:center;gap:8px;flex-wrap:wrap;align-self:center}
.dna-status{display:inline-flex;align-items:center;gap:6px;border-radius:999px;font-size:12px;font-weight:600;padding:3px 10px;line-height:1.4;white-space:nowrap}
.dna-status.up{background:var(--dna-pill-up-bg);color:var(--dna-pill-up-ink)}
.dna-status.warn{background:var(--dna-pill-warn-bg);color:var(--dna-pill-warn-ink)}
.dna-status.down{background:var(--dna-pill-down-bg);color:var(--dna-pill-down-ink)}
.dna-status.info{background:var(--dna-pill-info-bg);color:var(--dna-pill-info-ink)}
.dna-status.is-neutral{background:var(--dna-pill-neutral-bg);color:var(--dna-ink-2)}
.dna-status.is-review{background:var(--dna-surface);color:var(--dna-link);box-shadow:inset 0 0 0 1.5px rgba(26,110,245,.35)}
.dna-status.is-review i{width:5px;height:5px;border-radius:50%;flex:none;background:var(--dna-surface);border:2px solid var(--dna-link)}
html[data-color-theme="dark"] .dna-status.is-review{box-shadow:inset 0 0 0 1.5px rgba(138,180,248,.45)}
.dna-status.sm{font-size:11px;padding:2.5px 8px}
.dna-tag{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;border-radius:7px;padding:3.5px 9px;line-height:1.4;white-space:nowrap;max-width:100%}
.dna-tag.t-blue{background:var(--dna-pill-info-bg);color:var(--dna-pill-info-ink)}
.dna-tag.t-green{background:var(--dna-pill-up-bg);color:var(--dna-pill-up-ink)}
.dna-tag.t-amber{background:var(--dna-pill-warn-bg);color:var(--dna-pill-warn-ink)}
.dna-tag.t-neutral{background:var(--dna-pill-neutral-bg);color:var(--dna-ink-2)}
.dna-tag b{font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis}
.dna-tag small{font-size:10.5px;font-weight:700;opacity:.72;flex:none}
.dna-delta{font-size:13px;font-weight:600;white-space:nowrap;color:var(--dna-ink-3)}
.dna-delta.up{color:var(--dna-up)}
.dna-delta.down{color:var(--dna-down)}
.dna-due{display:inline-flex;align-items:baseline;gap:5px;font-size:13.5px;font-weight:500;color:var(--dna-ink);font-feature-settings:"tnum";white-space:nowrap}
.dna-due .late{font-size:11.5px;font-weight:600;color:var(--dna-late);font-style:normal}
.dna-due.is-done{color:var(--dna-ink-faint)}
.xc-ava16,.tp-ava,.tp-ava32,.tp-ava40{border-radius:50%;flex:none;background:var(--tp-ava-bg);color:var(--tp-ava-ink);display:inline-grid;place-items:center;font-weight:600;line-height:1}
.xc-ava16{width:16px;height:16px;font-size:9px}
.tp-ava{width:22px;height:22px;font-size:11px}
.tp-ava32{width:32px;height:32px;font-size:13px}
.tp-ava40{width:40px;height:40px;font-size:15px}
.tp-who{display:inline-flex;align-items:center;gap:6px;min-width:0;font-size:13px;font-weight:500;color:var(--dna-ink);white-space:nowrap;max-width:100%}
.tp-who small{font-size:13px;overflow:hidden;text-overflow:ellipsis;min-width:0}
.dna-tb-views{display:inline-flex;align-items:center;gap:2px}
.dna-tb-view{
  display:inline-flex;align-items:center;gap:7px;font-family:var(--dna-font);font-size:13.5px;font-weight:600;color:var(--dna-ink-2);
  background:transparent;border:0;border-radius:7px;padding:7px 12px;cursor:pointer;text-decoration:none;line-height:1.3;white-space:nowrap;
  transition:background var(--dna-motion-fast) ease,color var(--dna-motion-fast) ease;
}
.dna-tb-view svg{width:15px;height:15px;stroke:currentColor;fill:none;opacity:.85}
.dna-tb-view:hover{background:var(--dna-tb-face);color:var(--dna-ink)}
.dna-tb-view.on{background:var(--dna-tab-on-bg);color:var(--dna-tab-on-ink)}
.dna-tb-bar{display:flex;align-items:center;gap:10px;width:100%;flex-wrap:wrap}
.dna-tb-right{margin-left:auto;display:inline-flex;align-items:center;gap:8px;flex-wrap:wrap}
.dna-tb-count{font-size:12.5px;font-weight:600;color:var(--dna-ink-3);font-feature-settings:"tnum";white-space:nowrap}
.dna-tb-count b{color:var(--dna-ink)}
.dna-tb-sample{
  display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;color:var(--dna-pill-warn-ink);
  background:var(--dna-pill-warn-bg);border-radius:7px;padding:4px 9px;white-space:nowrap;box-shadow:inset 0 0 0 1px rgba(168,101,0,.28);cursor:help;
}
html[data-color-theme="dark"] .dna-tb-sample{box-shadow:inset 0 0 0 1px rgba(253,214,99,.3)}
.dna-tb-chips{display:flex;align-items:center;gap:7px;flex-wrap:wrap;width:100%;margin-top:10px}
.dna-tb-chip{
  display:inline-flex;align-items:center;gap:6px;font-family:var(--dna-font);font-size:12.5px;font-weight:600;line-height:1;color:var(--dna-ink);
  background:var(--dna-tb-face);border:1px solid transparent;border-radius:999px;padding:6px 11px;cursor:pointer;white-space:nowrap;
  transition:background var(--dna-motion-fast) ease;
}
.dna-tb-chip:hover{background:var(--dna-tb-face-hover)}
.dna-tb-chip .n{font-weight:500;color:var(--dna-ink-3);font-feature-settings:"tnum"}
.dna-tb-chip.active{color:var(--dna-pill-info-ink);background:linear-gradient(var(--dna-surface),var(--dna-surface)) padding-box,var(--dna-grad-ring) border-box}
.dna-tb-chip.active .n{color:var(--dna-pill-info-ink)}
.dna-tb-chip.is-scope{background:var(--dna-pill-info-bg);color:var(--dna-pill-info-ink);cursor:default}
.tp-tb-sep{width:1px;height:18px;background:var(--dna-tb-line);margin:0 2px}
.tp-tb-select{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:500;color:var(--dna-ink-3)}
.tp-tb-select .tp-select{font-size:12.5px;padding:5px 26px 5px 10px;border-radius:999px;border-color:transparent;background-color:var(--dna-tb-face)}
/* 開閉（.dna-fold — 行は button・なめらかに開く） */
.tp-fold{margin-top:8px}
button.tp-fold-row{
  display:inline-flex;align-items:center;gap:6px;min-height:30px;padding:0 8px 0 4px;margin-left:-4px;border:0;border-radius:8px;
  background:transparent;font:inherit;font-size:var(--dna-fs-small);font-weight:600;color:var(--dna-ink-2);cursor:pointer;text-align:left;
  transition:background var(--dna-motion-fast) ease;
}
button.tp-fold-row:hover{background:var(--dna-surface-2)}
.tp-fold-row .chev{width:14px;height:14px;flex:none;color:var(--dna-ink-3);transition:transform var(--dna-motion-base) var(--dna-ease-inout);stroke:currentColor;fill:none}
.tp-fold.is-open .tp-fold-row .chev{transform:rotate(90deg)}
.tp-fold-body{display:grid;grid-template-rows:0fr;transition:grid-template-rows var(--dna-motion-slow) var(--dna-ease-out)}
.tp-fold.is-open .tp-fold-body{grid-template-rows:1fr}
.tp-fold-body .inner{min-height:0;overflow:hidden}
.tp-fold.is-open .tp-fold-body .inner{padding:4px 0 6px 2px}
.tp-fold-body p{margin:0;font-size:var(--dna-fs-sub);font-weight:400;color:var(--dna-ink-2);line-height:1.65}
.tp-fold-body p + p{margin-top:6px}
.tp-li{display:grid;grid-template-columns:88px minmax(0,1fr);gap:4px 12px;align-items:baseline;padding:4px 0}
.tp-li span{font-size:var(--dna-fs-small);font-weight:600;color:var(--dna-ink-3)}
.tp-li b{font-size:var(--dna-fs-sub);font-weight:500;color:var(--dna-ink);min-width:0;line-height:1.55}
button.tp-rowtgl{
  width:28px;height:28px;padding:0;border:0;border-radius:7px;background:transparent;color:var(--dna-ink-3);cursor:pointer;display:inline-grid;place-items:center;flex:none;
  transition:background var(--dna-motion-fast) ease,color var(--dna-motion-fast) ease;
}
button.tp-rowtgl:hover{background:var(--dna-surface-2);color:var(--dna-ink)}
button.tp-rowtgl svg{width:14px;height:14px;stroke:currentColor;fill:none;transition:transform var(--dna-motion-base) var(--dna-ease-inout)}
button.tp-rowtgl[aria-expanded="true"] svg{transform:rotate(90deg)}
.tp-chev{width:16px;height:16px;flex:none;color:var(--dna-ink-faint);stroke:currentColor;fill:none;transition:color var(--dna-motion-fast) ease,transform var(--dna-motion-fast) ease}
.is-clickable:hover .tp-chev,[role="button"]:hover > .tp-chev{color:var(--dna-ink-2);transform:translateX(2px)}
.dna-eyebrow-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;min-height:30px;margin:22px 0 10px}
.dna-eyebrow-row > .right{margin-left:auto;display:inline-flex;align-items:center;gap:14px;flex-wrap:wrap}
.dna-eyebrow{display:inline-flex;align-items:center;gap:7px;min-width:0;margin:0;flex-wrap:wrap;font:700 11.5px/1 var(--dna-font);letter-spacing:.24em;text-transform:uppercase;color:var(--dna-ink-3);white-space:nowrap}
.dna-eyebrow svg{width:14px;height:14px;flex:none;stroke:var(--dna-chart);fill:none}
.dna-eyebrow .sub{font-weight:500;letter-spacing:.06em;color:var(--dna-ink-faint);text-transform:none;white-space:normal;line-height:1.4}
.tp-bar{display:block;height:8px;border-radius:4px;background:var(--dna-progress-track);overflow:hidden;position:relative;min-width:0}
.tp-bar i{display:block;height:100%;border-radius:4px;background:var(--dna-grad-h)}
.tp-bar.soft i{background:var(--tp-bar-soft)}
.tp-bar.warn i{background:var(--dna-pill-warn-ink)}
.tp-bar .goalmark{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--dna-ink-2);right:0}
.tp-stack{display:flex;height:12px;border-radius:999px;background:var(--dna-progress-track);overflow:hidden;position:relative;min-width:0}
.tp-stack i{display:block;height:100%}
.tp-stack .s-todo{background:var(--dna-control-off)}
.tp-stack .s-doing{background:var(--dna-chart)}
.tp-stack .s-review{background:var(--tp-bar-soft)}
.tp-stack .s-blocked{background:var(--dna-down)}
.tp-stack .s-done{background:var(--dna-grad-h)}
.tp-stack .plan{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--dna-ink-2)}
.tp-legend{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:8px;font-size:12.5px;font-weight:500;color:var(--dna-ink-2)}
.tp-legend span{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.tp-legend i{width:8px;height:8px;border-radius:50%;flex:none}
.tp-legend b{font-weight:600;color:var(--dna-ink);font-feature-settings:"tnum"}
.tp-legend .late,.tp-legend .late b{color:var(--dna-late)}
.tp-legend .late i{background:var(--dna-late)}
.tp-empty{margin:18px 0 0;font-size:var(--dna-fs-sub);font-weight:500;color:var(--dna-ink-3);text-align:center;padding:26px 0}
.tp-note{margin:10px 0 0;font-size:var(--dna-fs-small);font-weight:500;color:var(--dna-ink-3);line-height:1.6}
.tp-note b{font-weight:600;color:var(--dna-ink-2)}
.tp-link{font-size:var(--dna-fs-small);font-weight:600;color:var(--dna-link);text-decoration:none;white-space:nowrap;background:none;border:0;padding:0;cursor:pointer;font-family:inherit}
.tp-link:hover{text-decoration:underline}
.axis{font-size:11.5px;font-weight:500;fill:var(--dna-ink-3);font-family:var(--dna-font)}
.axis.strong{fill:var(--dna-ink);font-weight:600}
.grid{stroke:var(--tp-grid);stroke-width:1}
.tp-stop-a{stop-color:var(--dna-grad-a)}
.tp-stop-b{stop-color:var(--dna-grad-b)}

/* ============================================================
   5. 全体（環ゲージ主役・決めどころは軽く・分析はドロワーへ）
   ============================================================ */
.tp-grid-4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--dna-gap);margin-top:var(--dna-gap)}
.tp-grid-eq{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--dna-gap);margin-top:var(--dna-gap);align-items:start}
.tp-mt{margin-top:var(--dna-gap)}
/* 健全性 */
.tp-signals-card{padding:10px 14px 10px 18px}
.tp-signals-wrap{display:flex;align-items:center;gap:6px 16px;flex-wrap:wrap}
.tp-signals-h{flex:none;display:inline-flex;align-items:center;gap:8px;font-size:var(--dna-fs-sub);font-weight:600;color:var(--dna-ink-2);padding-right:8px;border-right:1px solid var(--dna-hairline-crisp);min-height:36px}
.tp-signals{display:flex;flex:1 1 520px;min-width:0;gap:4px}
.tp-signal{
  flex:1 1 0;min-width:0;display:flex;align-items:center;gap:10px;padding:7px 10px;border:1px solid transparent;border-radius:10px;
  background:transparent;font:inherit;color:var(--dna-ink);cursor:pointer;text-align:left;transition:background var(--dna-motion-fast) ease;
}
.tp-signal:hover{background:var(--dna-surface-2)}
.tp-signal .dot{width:12px;height:12px;border-radius:50%;flex:none;box-shadow:0 0 0 4px transparent}
.tp-signal.is-ok .dot{background:var(--dna-up);box-shadow:0 0 0 4px var(--dna-pill-up-bg)}
.tp-signal.is-warn .dot{background:var(--dna-pill-warn-ink);box-shadow:0 0 0 4px var(--dna-pill-warn-bg)}
.tp-signal.is-stop .dot{background:var(--dna-down);box-shadow:0 0 0 4px var(--dna-pill-down-bg)}
.tp-signal .t{display:grid;min-width:0;line-height:1.25;flex:1 1 auto}
.tp-signal .t b{font-size:var(--dna-fs-sub);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tp-signal .t small{font-size:11.5px;font-weight:600;letter-spacing:.02em}
.tp-signal.is-ok .t small{color:var(--dna-pill-up-ink)}
.tp-signal.is-warn .t small{color:var(--dna-pill-warn-ink)}
.tp-signal.is-stop .t small{color:var(--dna-pill-down-ink)}
/* 主役: 目標（環ゲージ）＋決めどころ（軽く） */
.tp-hero{display:grid;grid-template-columns:minmax(0,7fr) minmax(300px,5fr);gap:8px 36px;margin-top:var(--dna-gap);padding:22px 26px 20px}
.tp-hero-l{min-width:0;display:flex;flex-direction:column}
.tp-hero-kind{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tp-hero-title{margin:6px 0 0;font-size:var(--dna-fs-section);font-weight:600;color:var(--dna-ink);line-height:1.35}
.tp-hero-gloss{margin:2px 0 0;font-size:var(--dna-fs-small);font-weight:400;color:var(--dna-ink-3)}
.tp-kgi-body{display:flex;align-items:center;gap:8px 20px;flex-wrap:wrap;margin-top:8px}
.tp-gauge{width:300px;max-width:100%;height:auto;display:block;flex:0 1 300px}
.tp-gauge .track{fill:none;stroke:var(--dna-progress-track);stroke-width:18;stroke-linecap:round}
.tp-gauge .ghost{fill:none;stroke:var(--tp-bar-soft);stroke-width:18;stroke-linecap:round;stroke-dasharray:1 8;opacity:.95}
.tp-gauge .fill{fill:none;stroke:url(#tp-grad);stroke-width:18;stroke-linecap:round}
.tp-gauge .tick{stroke:var(--dna-ink);stroke-width:2.5;stroke-linecap:round}
.tp-gauge .hero{font-size:44px;font-weight:650;letter-spacing:-.8px;fill:var(--dna-ink);font-family:var(--dna-font)}
.tp-gauge .hero-sub{font-size:15px;font-weight:600;fill:var(--dna-ink-2);font-family:var(--dna-font)}
.tp-gauge .hero-top{font-size:12.5px;font-weight:600;fill:var(--dna-ink-3);font-family:var(--dna-font)}
.tp-gauge .lbl{font-size:11.5px;font-weight:600;fill:var(--dna-ink-3);font-family:var(--dna-font)}
.tp-gauge .lbl.strong{fill:var(--dna-ink)}
.tp-legend-k{flex:1 1 220px;min-width:0;display:grid;gap:2px;align-content:center}
.tp-legend-k .row{display:grid;grid-template-columns:22px minmax(0,1fr) auto;align-items:center;gap:8px;min-height:34px;padding:2px 0;border-bottom:1px solid var(--dna-hairline)}
.tp-legend-k .row:last-child{border-bottom:0}
.tp-legend-k .sw{width:14px;height:14px;border-radius:4px;justify-self:center}
.tp-legend-k .sw.grad{background:var(--dna-grad-h)}
.tp-legend-k .sw.tick{width:3px;height:16px;border-radius:2px;background:var(--dna-ink)}
.tp-legend-k .sw.ghost{background:repeating-linear-gradient(90deg,var(--tp-bar-soft) 0 3px,transparent 3px 6px);height:8px;border-radius:4px}
.tp-legend-k .sw.goal{background:transparent;border:2px solid var(--dna-ink-faint);border-radius:50%;width:12px;height:12px}
.tp-legend-k .k{font-size:var(--dna-fs-sub);font-weight:500;color:var(--dna-ink-2);min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tp-legend-k .k small{display:block;font-size:11.5px;font-weight:500;color:var(--dna-ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tp-legend-k .v{font-size:var(--dna-fs-section);font-weight:600;color:var(--dna-ink);white-space:nowrap;display:inline-flex;align-items:baseline;gap:6px;font-feature-settings:"tnum"}
.tp-legend-k .v .u{font-size:12.5px;font-weight:600;color:var(--dna-ink-2)}
.tp-bn{margin-top:12px;padding-top:12px;border-top:1px solid var(--dna-hairline);display:flex;align-items:center;gap:8px 12px;flex-wrap:wrap;font-size:var(--dna-fs-sub);font-weight:500;color:var(--dna-ink-2);line-height:1.5}
.tp-bn .gl{font-size:12px;color:var(--dna-ink-3)}
.tp-bn .n{font-weight:600;color:var(--dna-ink)}
.tp-bn .pace{display:inline-flex;align-items:baseline;gap:4px;font-feature-settings:"tnum"}
.tp-bn .pace b{font-size:var(--dna-fs-section);font-weight:600;color:var(--dna-ink)}
.tp-bn .pace.need b{color:var(--dna-pill-info-ink)}
.tp-bn .arrow{color:var(--dna-ink-faint)}
.tp-verdict{margin:12px 0 0;padding:12px 14px;border-radius:12px;background:var(--dna-surface-2);font-size:var(--dna-fs-body);font-weight:500;color:var(--dna-ink);line-height:1.65}
.tp-verdict .k{display:block;font-size:11.5px;font-weight:700;letter-spacing:.14em;color:var(--dna-ink-3);margin-bottom:4px}
.tp-hero-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:12px}
button.tp-btn{
  display:inline-flex;align-items:center;gap:7px;font-family:var(--dna-font);font-size:var(--dna-fs-sub);font-weight:600;color:var(--dna-ink);
  background:var(--dna-surface);border:1px solid var(--dna-border-strong);border-radius:var(--dna-radius-sm);padding:8px 14px;cursor:pointer;line-height:1.2;
  box-shadow:0 1px 2px rgba(16,18,26,.04);transition:background var(--dna-motion-fast) ease,box-shadow var(--dna-motion-fast) ease;white-space:nowrap;
}
button.tp-btn:hover{background:var(--dna-surface-2);box-shadow:0 2px 6px rgba(16,18,26,.08)}
button.tp-btn svg{width:15px;height:15px;stroke:currentColor;fill:none;flex:none}
button.tp-btn.solid{background:var(--dna-btn-grad);color:var(--dna-btn-grad-ink);border-color:transparent;box-shadow:0 4px 12px rgba(36,100,236,.22)}
button.tp-btn.solid:hover{box-shadow:0 6px 16px rgba(36,100,236,.3)}
.tp-hero-r{min-width:0;display:flex;flex-direction:column;padding-left:28px;border-left:1px solid var(--dna-hairline)}
.tp-decide-lt{display:grid;gap:2px;margin-top:8px}
.tp-dl-row{display:grid;grid-template-columns:22px minmax(0,1fr);gap:2px 10px;padding:10px 0;border-top:1px solid var(--dna-hairline)}
.tp-dl-row:first-child{border-top:0;padding-top:4px}
.tp-dl-row .no{width:20px;height:20px;border-radius:50%;background:var(--dna-pill-info-bg);color:var(--dna-pill-info-ink);font-size:11.5px;font-weight:600;display:grid;place-items:center;margin-top:1px}
.tp-dl-row .t{min-width:0;font-size:var(--dna-fs-sub);font-weight:600;color:var(--dna-ink);line-height:1.45}
.tp-dl-row .who{grid-column:2;display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;color:var(--dna-ink-3)}
.tp-dl-row .land{grid-column:2;display:grid;grid-template-columns:auto minmax(50px,1fr) auto;align-items:center;gap:10px;margin-top:6px;font-size:11.5px;font-weight:600;color:var(--dna-ink-3)}
.tp-dl-row .land .tp-bar{height:8px;overflow:visible}
.tp-dl-row .land b{font-size:var(--dna-fs-subject);font-weight:600;color:var(--dna-ink);font-feature-settings:"tnum";white-space:nowrap}
.tp-dl-row .land b small{font-size:11.5px;color:var(--dna-ink-2);margin-left:2px}
.tp-dl-row .land em{font-style:normal;font-size:11px;font-weight:600;padding:1.5px 6px;border-radius:999px;margin-left:4px}
.tp-dl-row .land em.ok{color:var(--dna-pill-up-ink);background:var(--dna-pill-up-bg)}
.tp-dl-row .land em.short{color:var(--dna-pill-down-ink);background:var(--dna-pill-down-bg)}
.tp-dl-row.is-base{grid-template-columns:22px minmax(0,1fr)}
.tp-dl-row.is-base .t{font-weight:500;color:var(--dna-ink-2)}
.tp-dl-row.is-base .no{background:transparent;color:var(--dna-ink-faint)}
.tp-hero-r .tp-note{margin-top:8px}
.tp-hero-r .tp-hero-actions{margin-top:auto;padding-top:12px}
/* KPI タイル（値＋前週比＋推移の小図＋目標に対する達成） */
.tp-kpi{display:flex;flex-direction:column;padding:18px 20px 14px;position:relative}
.tp-kpi .tp-chev{position:absolute;top:18px;right:16px}
.tp-kpi-head{display:flex;align-items:center;gap:8px;min-width:0;padding-right:22px}
.tp-kpi-head .k{min-width:0;font-size:var(--dna-fs-sub);font-weight:600;color:var(--dna-ink-2);line-height:1.35}
.tp-kpi-head .dna-tag{flex:none;font-size:11px;padding:2.5px 7px}
.tp-kpi-gloss{margin:3px 0 0;font-size:12.5px;font-weight:400;color:var(--dna-ink-3);line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.9em}
.tp-kpi-body{display:flex;align-items:flex-end;justify-content:space-between;gap:8px 12px;margin-top:8px;flex-wrap:wrap}
.tp-kpi-val{display:flex;align-items:baseline;gap:7px;min-width:0;flex-wrap:wrap;font-feature-settings:"tnum"}
.tp-kpi-val b{font-size:var(--dna-fs-hero);font-weight:650;letter-spacing:-.4px;color:var(--dna-ink);white-space:nowrap;line-height:1.1}
.tp-kpi-val .unit{font-size:14px;font-weight:600;color:var(--dna-ink-2)}
.tp-mini{width:96px;height:48px;flex:none;display:block}
.tp-mini .bar{fill:var(--tp-bar-soft)}
.tp-mini .bar.hot{fill:var(--dna-chart)}
.tp-mini .goal{stroke:var(--dna-ink-2);stroke-width:1.5;stroke-dasharray:2 3}
.tp-mini .goal-t{font-size:10.5px;font-weight:600;fill:var(--dna-ink-3);font-family:var(--dna-font)}
.tp-kpi-foot{margin:10px 0 0;display:flex;flex-wrap:wrap;gap:2px 10px;font-size:12px;font-weight:500;color:var(--dna-ink-3);line-height:1.5;align-items:center}
.tp-kpi-foot b{font-weight:600;color:var(--dna-ink-2)}
.tp-kpi-foot .asof{margin-left:auto;white-space:nowrap}
.tp-kpi-foot .tp-bar{width:100%;height:5px;margin-bottom:4px}
/* スケジュール（帯・今日の線・ゲート） */
.tp-band-wrap{margin-top:38px;position:relative}
.tp-band{position:relative;height:38px;border-radius:999px;background:var(--dna-progress-track)}
.tp-phase{position:absolute;top:0;bottom:0;display:flex;align-items:center;gap:7px;padding:0 12px;min-width:0;font-size:12.5px;font-weight:600;color:var(--dna-ink-2);white-space:nowrap;overflow:hidden}
.tp-phase .no{flex:none;width:18px;height:18px;border-radius:50%;background:var(--dna-surface);color:var(--dna-ink-2);display:grid;place-items:center;font-size:11px;font-weight:600;box-shadow:0 1px 2px rgba(16,18,26,.12)}
.tp-phase .nm{overflow:hidden;text-overflow:ellipsis;min-width:0}
.tp-phase.is-past{background:var(--dna-chart-band);color:var(--dna-ink-2)}
.tp-phase.is-now{background:var(--dna-grad-h);color:#fff}
.tp-phase.is-now .no{color:var(--dna-grad-a)}
.tp-phase.is-next{background:transparent;box-shadow:inset 0 0 0 1px var(--dna-border-strong)}
.tp-phase:first-child{border-radius:999px 0 0 999px}
.tp-phase.is-last{border-radius:0 999px 999px 0}
.tp-today{position:absolute;top:-8px;bottom:-14px;width:2px;background:var(--dna-chart);transform:translateX(-1px);z-index:2}
.tp-today-tag{position:absolute;top:-30px;transform:translateX(-50%);font-size:11.5px;font-weight:650;padding:3px 10px;border-radius:999px;background:var(--dna-pill-info-bg);color:var(--dna-pill-info-ink);white-space:nowrap;z-index:3;line-height:1.3}
.tp-gate{position:absolute;top:100%;margin-top:8px;transform:translateX(-50%);display:grid;justify-items:center;gap:3px;z-index:1}
.tp-gate i{width:12px;height:12px;border-radius:50%;background:var(--dna-surface);border:2px solid var(--dna-ink-faint);display:grid;place-items:center}
.tp-gate.is-done i{background:var(--dna-up);border-color:var(--dna-up)}
.tp-gate i svg{width:8px;height:8px;stroke:#fff;fill:none}
.tp-gate small{font-size:11.5px;font-weight:500;color:var(--dna-ink-3);white-space:nowrap;font-feature-settings:"tnum"}
.tp-gate.is-done small{color:var(--dna-pill-up-ink);font-weight:600}
.tp-phaselist{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px 14px;margin-top:46px}
.tp-phaselist .ph{display:grid;grid-template-columns:auto minmax(0,1fr);gap:1px 8px;min-width:0;font-size:12.5px;line-height:1.45}
.tp-phaselist .ph .no{grid-row:1 / span 3;width:20px;height:20px;border-radius:50%;background:var(--dna-surface-2);border:1px solid var(--dna-border);color:var(--dna-ink-2);display:grid;place-items:center;font-size:11px;font-weight:600;margin-top:1px}
.tp-phaselist .ph.is-now .no{background:var(--dna-pill-info-bg);border-color:transparent;color:var(--dna-pill-info-ink)}
.tp-phaselist .ph .nm{font-size:var(--dna-fs-sub);font-weight:600;color:var(--dna-ink);min-width:0}
.tp-phaselist .ph .dt{font-weight:500;color:var(--dna-ink-3);font-feature-settings:"tnum"}
.tp-phaselist .ph .gt{margin-top:4px;display:flex;align-items:center;gap:6px;flex-wrap:wrap;min-width:0}
.tp-phaselist .ph .gt small{font-size:12px;font-weight:500;color:var(--dna-ink-3);min-width:0}
/* タスクの状態（帯3本） */
.tp-stackrow{margin-top:14px}
.tp-stackrow:first-of-type{margin-top:12px}
.tp-stackrow .h{display:flex;align-items:baseline;gap:8px;margin-bottom:7px;font-size:var(--dna-fs-sub);font-weight:600;color:var(--dna-ink-2)}
.tp-stackrow .h b{font-size:var(--dna-fs-section);font-weight:600;color:var(--dna-ink);font-feature-settings:"tnum"}
.tp-stackrow .h small{font-size:12px;font-weight:500;color:var(--dna-ink-3);margin-left:auto;white-space:nowrap}
.tp-rate{display:flex;align-items:center;gap:10px}
.tp-rate .tp-bar{flex:1 1 auto}
.tp-rate b{flex:none;font-size:var(--dna-fs-section);font-weight:600;color:var(--dna-ink);font-feature-settings:"tnum"}
.tp-rate small{flex:none;font-size:12px;font-weight:500;color:var(--dna-ink-3);white-space:nowrap}
/* リスク・課題 */
.tp-ri{display:grid;margin-top:6px}
.tp-ri-row{display:grid;grid-template-columns:minmax(0,1fr);gap:6px;padding:12px 0;border-bottom:1px solid var(--dna-hairline)}
.tp-ri-row:last-child{border-bottom:0;padding-bottom:4px}
.tp-ri-row .st{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tp-ri-row .st small{font-size:11.5px;font-weight:600;color:var(--dna-ink-3);letter-spacing:.04em}
.tp-ri-row .tx{font-size:var(--dna-fs-sub);font-weight:500;color:var(--dna-ink);line-height:1.6;min-width:0}
.tp-ri-row .meta{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12.5px;font-weight:500;color:var(--dna-ink-3)}
.tp-ri-row .meta b{font-weight:600;color:var(--dna-ink-2)}
.tp-ri-row .meta .dna-due{font-size:12.5px}
.tp-ri-row .tp-fold{margin-top:0}
/* この人の今週（見る人の帯） */
.tp-mpanel{padding:16px 22px}
.tp-mpanel .ph{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.tp-mpanel .ph .t{min-width:0}
.tp-mpanel .ph .n{display:block;font-size:var(--dna-fs-subject);font-weight:600;color:var(--dna-ink)}
.tp-mpanel .ph .r{display:block;font-size:12.5px;font-weight:400;color:var(--dna-ink-3)}
.tp-mpanel .ph .right{margin-left:auto;display:inline-flex;align-items:center;gap:8px;flex-wrap:wrap}
.tp-mpanel-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px 24px;margin-top:12px;padding-top:12px;border-top:1px solid var(--dna-hairline)}
.tp-blk{min-width:0}
.tp-blk .k{display:block;font-size:11.5px;font-weight:600;color:var(--dna-ink-3);letter-spacing:.04em;margin-bottom:6px}
.tp-blk .big{display:inline-flex;align-items:baseline;gap:4px;font-size:var(--dna-fs-section);font-weight:600;color:var(--dna-ink);font-feature-settings:"tnum"}
.tp-blk .big small{font-size:12.5px;font-weight:500;color:var(--dna-ink-3)}
.tp-blk .big .late{font-size:12.5px;font-weight:600;color:var(--dna-late);margin-left:6px}
.tp-kdi{display:grid;gap:6px}
.tp-kdi .r{display:grid;grid-template-columns:minmax(0,1fr) 72px auto;align-items:center;gap:8px;font-size:12.5px}
.tp-kdi .r .nm{font-weight:500;color:var(--dna-ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.tp-kdi .r .tp-bar{height:6px}
.tp-kdi .r b{font-weight:600;color:var(--dna-ink);white-space:nowrap;font-feature-settings:"tnum"}
.tp-kdi .r b small{font-weight:500;color:var(--dna-ink-3)}
.tp-mini-list{display:grid;gap:5px;font-size:12.5px}
.tp-mini-list .r{display:flex;align-items:center;gap:8px;min-width:0}
.tp-mini-list .r .tx{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--dna-ink);font-weight:500}
.tp-mini-list .r .dna-status{flex:none;margin-left:auto}
.tp-mini-list .r .dna-due{font-size:12.5px;flex:none}
.tp-rolecount{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12.5px;font-weight:500;color:var(--dna-ink-2);align-items:center}
.tp-rolecount span{display:inline-flex;align-items:baseline;gap:4px;white-space:nowrap}
.tp-rolecount span b{font-weight:600;color:var(--dna-ink);font-feature-settings:"tnum"}
.tp-rolecount span i{font-style:normal;font-size:10.5px;font-weight:700;color:var(--dna-pill-info-ink);background:var(--dna-pill-info-bg);border-radius:5px;padding:1px 5px}
.tp-rolecount span.q i{color:var(--dna-ink-3);background:var(--dna-pill-neutral-bg)}

/* ============================================================
   6. タスク（看板 ⇄ 期限順・1行）
   ============================================================ */
.tkb-kan{display:grid;grid-auto-flow:column;grid-auto-columns:var(--tp-lane-w);gap:14px;align-items:start;margin-top:12px;overflow-x:auto;padding-bottom:8px;scrollbar-width:thin;scrollbar-color:var(--dna-chart-soft) transparent}
.tkb-kan::-webkit-scrollbar{height:7px}
.tkb-kan::-webkit-scrollbar-thumb{background:var(--dna-chart-soft);border-radius:999px}
.tkb-col{display:flex;flex-direction:column;min-width:0;background:var(--dna-surface);border:1px solid var(--dna-border);border-radius:12px;box-shadow:var(--tp-lane-shadow);overflow:hidden}
.tkb-col-rail{height:3px;flex:0 0 auto}
.tkb-col.is-todo .tkb-col-rail{background:var(--dna-ink-faint)}
.tkb-col.is-doing .tkb-col-rail{background:var(--dna-chart)}
.tkb-col.is-review .tkb-col-rail{background:repeating-linear-gradient(90deg,var(--dna-chart) 0 10px,var(--dna-chart-soft) 10px 20px)}
.tkb-col.is-blocked .tkb-col-rail{background:var(--dna-down)}
.tkb-col-head{display:flex;align-items:center;gap:8px;padding:12px 14px 10px}
.tkb-col-head i{width:8px;height:8px;border-radius:50%;flex:0 0 auto}
.tkb-col.is-todo .tkb-col-head i{background:var(--dna-ink-faint)}
.tkb-col.is-doing .tkb-col-head i{background:var(--dna-chart)}
.tkb-col.is-review .tkb-col-head i{background:var(--dna-surface);border:2px solid var(--dna-chart)}
.tkb-col.is-blocked .tkb-col-head i{background:var(--dna-down)}
.tkb-col-head b{flex:0 1 auto;min-width:0;font-size:var(--dna-fs-small);font-weight:600;color:var(--dna-ink);letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tkb-col-n{flex:none;font-size:var(--dna-fs-section);font-weight:400;color:var(--dna-ink-3);font-feature-settings:"tnum";line-height:1}
.tkb-col-body{display:grid;gap:9px;padding:2px 12px 12px;align-content:start}
.tkb-task{display:grid;gap:8px;min-width:0;background:var(--dna-surface);border:1px solid var(--dna-border-strong);border-radius:10px;padding:11px 12px 10px;cursor:pointer;transition:box-shadow var(--dna-motion-base) ease,border-color var(--dna-motion-fast) ease}
.tkb-task:hover{box-shadow:var(--tp-card-shadow-hover);border-color:var(--dna-chart-soft)}
.tkb-task.is-over{border-left:4px solid var(--dna-late)}
.tkb-task-title{font-size:var(--dna-fs-small);font-weight:600;color:var(--dna-ink);line-height:1.5;min-width:0}
.tkb-task-meta{display:flex;align-items:center;gap:7px;min-width:0}
.tkb-task-meta small{font-size:11.5px;font-weight:500;color:var(--dna-ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.tkb-task-meta .dna-due{margin-left:auto;flex:none;font-size:11.5px}
.tkb-task .tkb-task-more{display:grid;grid-template-rows:0fr;opacity:0;margin-top:0;padding-top:0;border-top:1px solid transparent;transition:grid-template-rows var(--dna-motion-slow) var(--dna-ease-out),opacity var(--dna-motion-base) ease,margin-top var(--dna-motion-base) ease,padding-top var(--dna-motion-base) ease,border-top-color var(--dna-motion-base) ease}
.tkb-task:hover .tkb-task-more,.tkb-task:focus-visible .tkb-task-more{grid-template-rows:1fr;opacity:1;margin-top:2px;padding-top:8px;border-top-color:var(--dna-hairline)}
.tkb-task-more .in{overflow:hidden;min-height:0;min-width:0;display:grid;gap:8px}
.tkb-sub{background:var(--dna-surface-2);border-radius:8px;padding:8px 10px;display:grid;gap:5px;min-width:0}
.tkb-sub .h{display:flex;align-items:center;gap:8px;font-size:11.5px;font-weight:600;color:var(--dna-ink-2)}
.tkb-sub .h small{margin-left:auto;font-weight:500;color:var(--dna-ink-3)}
.tkb-sub .it{display:flex;align-items:flex-start;gap:8px;min-width:0}
.tkb-sub .it i{width:10px;height:10px;border-radius:50%;flex:none;margin-top:4px;border:1.5px dashed var(--dna-ink-faint);background:var(--dna-surface)}
.tkb-sub .it span{min-width:0;font-size:11.5px;font-weight:500;color:var(--dna-ink-2);line-height:1.6}
.tkb-col-empty{border:1px dashed var(--dna-border-strong);border-radius:10px;padding:18px 10px;text-align:center;font-size:11.5px;font-weight:500;color:var(--dna-ink-faint)}
.tkb-task.is-me{border-color:transparent;background:linear-gradient(var(--dna-surface),var(--dna-surface)) padding-box,var(--dna-grad-ring) border-box}
.tkb-task.is-me.is-over{border-left-color:var(--dna-late)}
/* 期限順の一覧（1行） */
.tp-tlist{margin-top:12px;padding:6px 10px 8px}
.tp-tgroup{padding:6px 0 2px}
.tp-tgroup-h{display:flex;align-items:center;gap:8px;padding:8px 10px 6px;font-size:11.5px;font-weight:700;letter-spacing:.14em;color:var(--dna-ink-3);text-transform:uppercase}
.tp-tgroup-h .n{font-weight:500;letter-spacing:0;color:var(--dna-ink-faint)}
.tp-tgroup-h.is-late{color:var(--dna-late)}
.tp-tgroup-h i{width:7px;height:7px;border-radius:50%;background:currentColor;opacity:.6}
.tp-trow{display:grid;grid-template-columns:minmax(0,1fr) minmax(150px,200px) 118px 96px 24px;align-items:center;gap:0 12px;min-height:52px;padding:6px 8px 6px 12px;border-top:1px solid var(--dna-hairline-crisp);cursor:pointer;transition:background var(--dna-motion-fast) ease}
.tp-trow:hover{background:var(--dna-surface-2)}
.tp-trow.is-me{box-shadow:inset 3px 0 0 var(--dna-chart)}
.tp-trow .n{min-width:0;font-size:var(--dna-fs-body);font-weight:600;color:var(--dna-ink);line-height:1.45;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tp-trow .meta{display:contents}
.tp-trow .c{min-width:0;display:flex;align-items:center}
.tp-trow .c.due{font-feature-settings:"tnum"}
.tp-trow .tp-who{max-width:100%}
.tp-tlist-foot{margin:0;padding:10px 10px 4px;font-size:12px;font-weight:500;color:var(--dna-ink-3);line-height:1.6}

/* ============================================================
   7. メンバー（1人1枚の横長カード）
   ============================================================ */
.tp-mrows{display:grid;gap:12px;margin-top:12px}
.tp-mrow{display:grid;grid-template-columns:minmax(220px,1.15fr) minmax(180px,1fr) 170px 224px minmax(170px,1fr) 24px;gap:0 22px;align-items:center;padding:16px 20px;min-height:100px}
.tp-mrow > .c{min-width:0}
.tp-mrow .who{display:flex;align-items:center;gap:12px}
.tp-mrow .who .t{min-width:0;display:grid;gap:2px}
.tp-mrow .who .n{font-size:var(--dna-fs-subject);font-weight:600;color:var(--dna-ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:6px}
.tp-mrow .who .n .dna-status{font-size:10.5px;padding:1.5px 7px}
.tp-mrow .who .r{font-size:12.5px;font-weight:400;color:var(--dna-ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tp-mrow .who .cond{display:inline-flex;gap:6px;align-items:center;margin-top:2px}
.tp-mrow .k{display:block;font-size:11px;font-weight:600;color:var(--dna-ink-3);letter-spacing:.06em;margin-bottom:5px;white-space:nowrap}
.tp-mrow .wps .main{font-size:13px;font-weight:600;color:var(--dna-ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block;margin-bottom:4px}
.tp-mrow .wps .main small{font-weight:500;color:var(--dna-ink-3);margin-left:4px}
.tp-mrow .tasks .h{display:flex;align-items:baseline;gap:5px;font-size:12.5px;font-weight:500;color:var(--dna-ink-2);font-feature-settings:"tnum";margin-bottom:6px}
.tp-mrow .tasks .h b{font-size:var(--dna-fs-section);font-weight:600;color:var(--dna-ink)}
.tp-mrow .tasks .h .late{color:var(--dna-late);font-weight:600;margin-left:auto}
.tp-mrow .tasks .tp-stack{height:8px}
.tp-mrow .tasks .none{font-size:12.5px;color:var(--dna-ink-faint)}
.tp-load{width:100%;height:58px;display:block}
.tp-load .bar{fill:var(--tp-minibar)}
.tp-load .bar.hot{fill:url(#tp-grad-v)}
.tp-load .lb{font-size:11px;font-weight:500;fill:var(--dna-ink-3);font-family:var(--dna-font)}
.tp-load .lb.hot{fill:var(--dna-ink);font-weight:600}
.tp-load .pc{font-size:11px;font-weight:600;fill:var(--dna-ink-2);font-family:var(--dna-font)}
.tp-mrow .next .l1{display:flex;align-items:center;gap:8px;min-width:0;margin-bottom:3px}
.tp-mrow .next .tx{font-size:12.5px;font-weight:500;color:var(--dna-ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;line-height:1.4;display:block}
.tp-mrow .next .none{font-size:12.5px;color:var(--dna-ink-faint)}
.tp-members-sum{display:flex;align-items:center;gap:14px;flex-wrap:wrap;font-size:var(--dna-fs-sub);font-weight:500;color:var(--dna-ink-2)}
.tp-members-sum b{font-weight:600;color:var(--dna-ink);font-feature-settings:"tnum"}
.tp-members-sum .late,.tp-members-sum .late b{color:var(--dna-late)}

/* ============================================================
   8. 工程表（フェーズ × 束 × タスク × 稼働 — 1本の時間軸・余日と遅れ）
   ============================================================ */
.tp-tl-card{padding:0;overflow:hidden;margin-top:12px}
.tp-tl-tools{display:flex;align-items:center;gap:8px 16px;flex-wrap:wrap;padding:14px 18px 10px;border-bottom:1px solid var(--dna-hairline)}
.tp-tl-tools .tp-legend{margin:0;margin-left:auto}
.tp-tl-tools .tp-legend i.ph{border-radius:2px;width:14px;height:8px;background:var(--dna-chart-band)}
.tp-tl-tools .tp-legend i.rem{border-radius:2px;width:14px;height:6px;background:var(--tp-bar-soft)}
.tp-tl-tools .tp-legend i.ov{border-radius:2px;width:14px;height:6px;background:var(--dna-pill-down-bg);box-shadow:inset 0 0 0 1px var(--dna-late)}
.tp-tl-tools .tp-legend i.dm{width:9px;height:9px;transform:rotate(45deg);border-radius:2px;background:var(--dna-surface);border:2px solid var(--dna-chart)}
.tp-tl-tools .tp-legend i.dn{width:9px;height:9px;border-radius:50%;background:var(--dna-up)}
.tp-tl{--tl-left:360px;--tl-week:56px;--tl-w:15;position:relative;overflow:auto;max-height:78vh;scrollbar-width:thin;scrollbar-color:var(--dna-chart-soft) transparent}
.tp-tl::-webkit-scrollbar{height:8px;width:8px}
.tp-tl::-webkit-scrollbar-thumb{background:var(--dna-chart-soft);border-radius:999px}
.tp-tl-in{position:relative;min-width:calc(var(--tl-left) + var(--tl-week) * var(--tl-w))}
.tp-tl-row{display:grid;grid-template-columns:var(--tl-left) repeat(var(--tl-w),var(--tl-week));align-items:stretch;border-bottom:1px solid var(--dna-hairline)}
.tp-tl-row.is-head{position:sticky;top:0;z-index:5;background:var(--dna-surface);border-bottom:1px solid var(--dna-hairline-crisp)}
.tp-tl-row.is-head .tp-tl-left{background:var(--dna-surface);padding:8px 16px 6px;display:flex;align-items:flex-end;gap:12px;font-size:12px;font-weight:600;color:var(--dna-ink-3)}
.tp-tl-row.is-head .tp-tl-left span:nth-child(2){margin-left:auto;width:64px}
.tp-tl-row.is-head .tp-tl-left span:nth-child(3){width:56px;text-align:right}
.tp-tl-left{position:sticky;left:0;z-index:3;background:var(--dna-surface);display:flex;align-items:center;gap:8px;min-width:0;padding:0 16px;border-right:1px solid var(--dna-hairline-crisp);min-height:44px}
.tp-tl-left .nm{min-width:0;flex:1 1 auto;font-size:13.5px;font-weight:500;color:var(--dna-ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.35}
.tp-tl-left .nm small{display:block;font-size:11.5px;font-weight:500;color:var(--dna-ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tp-tl-left .dt{flex:none;width:64px;font-size:12.5px;font-feature-settings:"tnum";color:var(--dna-ink-2);text-align:left}
.tp-tl-left .dt .dna-due{font-size:12.5px}
.tp-tl-left .rem{flex:none;width:56px;text-align:right;font-size:12px;font-weight:600;font-feature-settings:"tnum";color:var(--dna-ink-2)}
.tp-tl-left .rem.is-over{color:var(--dna-late)}
.tp-tl-left .rem.is-done{color:var(--dna-pill-up-ink)}
.tp-tl-left .rem.is-none{color:var(--dna-ink-faint);font-weight:500}
.tp-tl-row.is-phase .tp-tl-left{background:var(--dna-surface-2);min-height:46px}
.tp-tl-row.is-phase .tp-tl-left .nm{font-size:13.5px;font-weight:600}
.tp-tl-row.is-phase .no{flex:none;width:20px;height:20px;border-radius:50%;background:var(--dna-surface);border:1px solid var(--dna-border);color:var(--dna-ink-2);display:grid;place-items:center;font-size:11px;font-weight:600}
.tp-tl-row.is-phase.is-now .no{background:var(--dna-pill-info-bg);border-color:transparent;color:var(--dna-pill-info-ink)}
.tp-tl-row.is-phase button.tp-rowtgl{margin-left:-6px}
.tp-tl-row.is-wp .tp-tl-left{padding-left:34px}
.tp-tl-row.is-wp .tp-tl-left .nm{font-weight:600}
.tp-tl-row.is-task .tp-tl-left{padding-left:54px;min-height:38px;background:var(--dna-surface)}
.tp-tl-row.is-task .tp-tl-left .nm{font-size:12.5px;color:var(--dna-ink-2)}
.tp-tl-row.is-wp,.tp-tl-row.is-task{cursor:pointer}
.tp-tl-row.is-wp:hover .tp-tl-left,.tp-tl-row.is-task:hover .tp-tl-left,.tp-tl-row.is-wp:hover .tp-tl-lane,.tp-tl-row.is-task:hover .tp-tl-lane{background:var(--dna-surface-2)}
.tp-tl-row.is-person .tp-tl-left{padding-left:16px;min-height:52px}
.tp-tl-row.is-sec .tp-tl-left{background:var(--dna-surface-2);min-height:36px;font-size:11.5px;font-weight:700;letter-spacing:.14em;color:var(--dna-ink-3)}
.tp-tl-row.is-sec .tp-tl-lane{background:var(--dna-surface-2)}
.tp-tl-lane{grid-column:2 / -1;position:relative;min-height:44px;background-image:repeating-linear-gradient(90deg,transparent 0 calc(var(--tl-week) - 1px),var(--dna-hairline) calc(var(--tl-week) - 1px) var(--tl-week))}
.tp-tl-row.is-head .tp-tl-lane{min-height:68px;background-image:none}
.tp-tl-row.is-head .tp-tl-lane .mo{position:absolute;top:6px;font-size:12px;font-weight:600;color:var(--dna-ink-2);padding-left:6px;border-left:1px solid var(--dna-hairline-crisp);height:20px;line-height:20px}
.tp-tl-row.is-head .tp-tl-lane .wk{position:absolute;top:28px;font-size:11px;font-weight:500;color:var(--dna-ink-3);font-feature-settings:"tnum";width:var(--tl-week);text-align:center}
.tp-tl-row.is-head .tp-tl-lane .wk.hot{color:var(--dna-pill-info-ink);font-weight:600}
.tp-tl-bar{position:absolute;top:50%;transform:translateY(-50%);height:24px;border-radius:7px;display:flex;align-items:center;padding:0 10px;font-size:12px;font-weight:600;color:var(--dna-ink-2);white-space:nowrap;overflow:hidden;background:var(--dna-chart-band)}
.tp-tl-bar.is-now{background:var(--dna-grad-h);color:#fff}
.tp-tl-bar.is-next{background:transparent;box-shadow:inset 0 0 0 1px var(--dna-border-strong)}
.tp-tl-rem{position:absolute;top:50%;transform:translateY(-50%);height:8px;border-radius:4px;background:var(--tp-bar-soft)}
.tp-tl-rem.is-over{background:var(--dna-pill-down-bg);box-shadow:inset 0 0 0 1px var(--dna-late)}
.tp-tl-row.is-task .tp-tl-rem{height:5px}
.tp-tl-dm{position:absolute;top:50%;width:12px;height:12px;transform:translate(-50%,-50%) rotate(45deg);border-radius:3px;background:var(--dna-surface);border:2px solid var(--dna-chart);z-index:2}
.tp-tl-dm.is-done{background:var(--dna-up);border-color:var(--dna-up);transform:translate(-50%,-50%) rotate(0);border-radius:50%}
.tp-tl-dm.is-over{border-color:var(--dna-late);background:var(--dna-pill-down-bg)}
.tp-tl-dm.is-todo{border-color:var(--dna-ink-faint)}
.tp-tl-row.is-task .tp-tl-dm{width:9px;height:9px;border-width:1.5px}
.tp-tl-gate{position:absolute;top:50%;transform:translate(-50%,-50%);width:14px;height:14px;border-radius:50%;background:var(--dna-surface);border:2px solid var(--dna-ink-faint);display:grid;place-items:center;z-index:2}
.tp-tl-gate.is-done{background:var(--dna-up);border-color:var(--dna-up)}
.tp-tl-gate svg{width:8px;height:8px;stroke:#fff;fill:none}
.tp-tl-today{position:absolute;top:0;bottom:0;width:2px;background:var(--dna-chart);z-index:4;pointer-events:none}
.tp-tl-today-tag{position:absolute;top:46px;transform:translateX(-50%);font-size:11px;font-weight:650;padding:2px 8px;border-radius:999px;background:var(--dna-pill-info-bg);color:var(--dna-pill-info-ink);white-space:nowrap;z-index:6;line-height:1.3;pointer-events:none}
.tp-tl-load{position:absolute;bottom:8px;height:0;border-radius:4px 4px 0 0;background:rgba(var(--tp-heat),.28);display:flex;align-items:flex-start;justify-content:center;font-size:11px;font-weight:600;color:var(--dna-ink-2);font-feature-settings:"tnum";overflow:visible}
.tp-tl-load.hot{background:rgba(var(--tp-heat),.5)}
.tp-tl-load span{position:absolute;top:-16px;line-height:1}
.tp-tl-foot{padding:10px 18px 12px;font-size:12px;font-weight:500;color:var(--dna-ink-3);line-height:1.6;border-top:1px solid var(--dna-hairline);display:flex;flex-wrap:wrap;gap:2px 18px}
.tp-tl-foot b{font-weight:600;color:var(--dna-ink-2)}

/* ============================================================
   9. 会議（2枚表示の横スライド＋縦の段階開示）
   ============================================================ */
.tp-car-head{display:flex;align-items:center;gap:8px 16px;flex-wrap:wrap;margin-top:4px}
.tp-steps{display:inline-flex;align-items:center;gap:0;flex-wrap:wrap}
button.tp-step{
  display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border:1px solid transparent;border-radius:999px;background:transparent;font:inherit;font-size:13px;font-weight:600;color:var(--dna-ink-2);cursor:pointer;
  transition:background var(--dna-motion-fast) ease,color var(--dna-motion-fast) ease;
}
button.tp-step:hover{background:var(--dna-surface-2);color:var(--dna-ink)}
button.tp-step.on{background:var(--dna-tab-on-bg);color:var(--dna-tab-on-ink)}
button.tp-step .st{font-size:10.5px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--dna-ink-3)}
button.tp-step.on .st{color:var(--dna-pill-info-ink)}
button.tp-step .dt{font-feature-settings:"tnum"}
.tp-step-gap{width:22px;height:2px;background:var(--dna-border-strong);border-radius:2px;flex:none}
.tp-step-gap.is-done{background:var(--dna-grad-h)}
.tp-step-gap.is-todo{background:repeating-linear-gradient(90deg,var(--dna-ink-faint) 0 5px,transparent 5px 10px)}
.tp-car-nav{margin-left:auto;display:inline-flex;align-items:center;gap:6px}
.tp-car-nav .pos{font-size:12px;font-weight:600;color:var(--dna-ink-3);font-feature-settings:"tnum";margin-right:4px}
.tp-car{overflow:hidden;margin-top:12px;padding:6px 6px 14px;margin-left:-6px;margin-right:-6px}
.tp-car-track{display:flex;gap:var(--dna-gap);align-items:flex-start;transition:transform var(--dna-motion-slow) var(--dna-ease-inout);will-change:transform}
.tp-mtg{flex:0 0 calc((100% - var(--dna-gap)) / 2);min-width:0;display:flex;flex-direction:column;gap:0;padding:18px 20px 12px}
.tp-mtg-head{display:flex;align-items:flex-start;gap:12px}
.tp-mtg-head .stage{font-size:11.5px;font-weight:700;letter-spacing:.24em;text-transform:uppercase;color:var(--dna-ink-3);line-height:1;padding-top:6px;flex:none;width:44px}
.tp-mtg-head .stage.now{color:var(--dna-pill-info-ink)}
.tp-mtg-head .d{min-width:0;flex:1 1 auto}
.tp-mtg-head .d b{display:block;font-size:18px;font-weight:600;color:var(--dna-ink);line-height:1.3;letter-spacing:-.2px}
.tp-mtg-head .d small{display:block;margin-top:3px;font-size:12.5px;font-weight:500;color:var(--dna-ink-3)}
.tp-mtg-head .right{flex:none;padding-top:4px}
.tp-mtg-sum{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:14px 0 6px}
.tp-mtg-sum .s{padding:10px 12px;border-radius:10px;background:var(--dna-surface-2);min-width:0}
.tp-mtg-sum .s .k{display:block;font-size:11px;font-weight:600;color:var(--dna-ink-3);letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tp-mtg-sum .s .v{display:flex;align-items:baseline;gap:4px;margin-top:3px;font-size:var(--dna-fs-section);font-weight:650;color:var(--dna-ink);font-feature-settings:"tnum";white-space:nowrap}
.tp-mtg-sum .s .v small{font-size:11.5px;font-weight:500;color:var(--dna-ink-3)}
.tp-mtg-sum .s .v.late{color:var(--dna-late)}
.tp-mtg-sum .s .tp-bar{height:5px;margin-top:6px}
.tp-mx{border-top:1px solid var(--dna-hairline)}
button.tp-mx-h{
  width:100%;display:flex;align-items:center;gap:10px;padding:12px 4px 12px 2px;border:0;background:transparent;font:inherit;text-align:left;cursor:pointer;color:var(--dna-ink);border-radius:8px;
  transition:background var(--dna-motion-fast) ease;
}
button.tp-mx-h:hover{background:var(--dna-surface-2)}
button.tp-mx-h .t{font-size:var(--dna-fs-sub);font-weight:600;color:var(--dna-ink);flex:none}
button.tp-mx-h .n{font-size:var(--dna-fs-section);font-weight:600;color:var(--dna-ink);font-feature-settings:"tnum";flex:none}
button.tp-mx-h .s{font-size:12px;font-weight:500;color:var(--dna-ink-3);min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1 1 auto}
button.tp-mx-h .chev{width:14px;height:14px;flex:none;color:var(--dna-ink-3);stroke:currentColor;fill:none;transition:transform var(--dna-motion-base) var(--dna-ease-inout)}
button.tp-mx-h[aria-expanded="true"] .chev{transform:rotate(90deg)}
.tp-mx-b{display:grid;grid-template-rows:0fr;transition:grid-template-rows var(--dna-motion-slow) var(--dna-ease-out)}
.tp-mx.is-open .tp-mx-b{grid-template-rows:1fr}
.tp-mx-b .inner{min-height:0;overflow:hidden}
.tp-mx.is-open .tp-mx-b .inner{padding:0 2px 12px}
.tp-check{display:grid;gap:2px}
.tp-check .r{display:grid;grid-template-columns:18px minmax(0,1fr);align-items:start;gap:4px 8px;min-height:32px;padding:5px 4px;border-radius:8px}
.tp-check .r.is-me{background:var(--dna-pill-info-bg)}
.tp-check .r .ck{width:16px;height:16px;border-radius:50%;display:grid;place-items:center;background:var(--dna-surface);border:1.5px solid var(--dna-ink-faint);margin-top:2px}
.tp-check .r .ck.on{background:var(--dna-up);border-color:var(--dna-up)}
.tp-check .r .ck svg{width:10px;height:10px;stroke:#fff;fill:none}
.tp-check .r .tx{min-width:0;font-size:13.5px;font-weight:500;color:var(--dna-ink);line-height:1.5}
.tp-check .r .tx .ml{display:flex;align-items:center;flex-wrap:wrap;gap:3px 10px;margin-top:3px;font-size:11.5px;font-weight:500;color:var(--dna-ink-3);line-height:1.5}
.tp-check .r .tx .ml .own{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.tp-check .r .tx .dod{display:block;margin-top:4px;font-size:12.5px;font-weight:400;color:var(--dna-ink-2);line-height:1.55}
.tp-check .r .tx .dod b{font-weight:600;color:var(--dna-ink-3);font-size:11px;letter-spacing:.06em;margin-right:6px}
.tp-check .r .dna-status{font-size:11px;padding:2px 8px}
.tp-check .r .dna-due{font-size:12px}
.tp-pills{display:flex;flex-wrap:wrap;gap:6px}
.tp-pills .dna-tag{white-space:normal;text-align:left;line-height:1.5;max-width:100%}
.tp-before{display:grid;gap:6px}
.tp-before .r{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px;align-items:baseline;font-size:13.5px;font-weight:500;color:var(--dna-ink-2);line-height:1.5}
.tp-before .r .w{font-size:11.5px;font-weight:700;color:var(--dna-pill-info-ink);background:var(--dna-pill-info-bg);border-radius:6px;padding:2px 8px;white-space:nowrap}
.tp-agenda{display:grid;gap:2px}
.tp-agenda .r{display:grid;grid-template-columns:22px minmax(0,1fr) auto;align-items:start;gap:8px;padding:6px 6px;border-radius:8px;font-size:13.5px;font-weight:500;color:var(--dna-ink);line-height:1.5}
.tp-agenda .r .no{width:20px;height:20px;border-radius:50%;background:var(--dna-surface-2);border:1px solid var(--dna-border);color:var(--dna-ink-2);display:grid;place-items:center;font-size:11px;font-weight:600;margin-top:1px}
.tp-agenda .r.is-decide{background:var(--dna-pill-info-bg)}
.tp-agenda .r.is-decide .no{background:var(--dna-surface);border-color:transparent;color:var(--dna-pill-info-ink)}
.tp-agenda .r .dna-tag{font-size:11px;padding:2.5px 8px;margin-top:1px}
.tp-faces{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.tp-faces .tp-who{font-size:12.5px;padding:2px 8px 2px 3px;border-radius:999px;background:var(--dna-surface-2)}
.tp-faces .tp-who.is-me{background:var(--dna-pill-info-bg)}
.tp-mini-decide{display:grid;gap:8px}
.tp-mini-decide .r{display:grid;grid-template-columns:22px minmax(0,1fr);gap:3px 8px;align-items:start}
.tp-mini-decide .r .no{width:20px;height:20px;border-radius:50%;background:var(--dna-pill-info-bg);color:var(--dna-pill-info-ink);font-size:11.5px;font-weight:600;display:grid;place-items:center;margin-top:1px}
.tp-mini-decide .r .t{font-size:13.5px;font-weight:600;color:var(--dna-ink);line-height:1.45;min-width:0}
.tp-mini-decide .r .who{grid-column:2;display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;color:var(--dna-ink-3)}
.tp-mini-decide .r .land{grid-column:2;display:grid;grid-template-columns:auto minmax(50px,1fr) auto;align-items:center;gap:8px;font-size:11.5px;font-weight:600;color:var(--dna-ink-3)}
.tp-mini-decide .r .land .tp-bar{height:7px}
.tp-mini-decide .r .land b{font-size:var(--dna-fs-subject);font-weight:600;color:var(--dna-ink);font-feature-settings:"tnum";white-space:nowrap}
.tp-mini-decide .r .land b small{font-size:11.5px;color:var(--dna-ink-2);margin-left:2px}
.tp-mini-decide .r.is-base .t{font-weight:500;color:var(--dna-ink-2)}
.tp-dec{display:grid;gap:2px}
.tp-dec .r{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 14px;padding:12px 0;border-bottom:1px solid var(--dna-hairline);align-items:start}
.tp-dec .r:last-child{border-bottom:0}
.tp-dec .r .dt{font-size:12.5px;font-weight:600;color:var(--dna-ink-3);font-feature-settings:"tnum";white-space:nowrap;padding-top:2px}
.tp-dec .r .tx{font-size:var(--dna-fs-body);font-weight:600;color:var(--dna-ink);line-height:1.5;min-width:0}
.tp-dec .r .tp-fold{grid-column:2;margin-top:0}

/* ============================================================
   10. 右からの詳細ドロワー（段階開示の器）
   ============================================================ */
.tp-scrim{position:fixed;inset:0;background:var(--tp-scrim);z-index:49;opacity:0;transition:opacity var(--dna-motion-base) ease}
.tp-scrim.is-on{opacity:1}
.tp-drawer{
  position:fixed;top:0;right:0;bottom:0;width:min(600px,100%);z-index:50;background:var(--dna-surface);box-shadow:var(--tp-drawer-shadow);
  display:flex;flex-direction:column;transform:translateX(102%);transition:transform var(--dna-motion-slow) var(--dna-ease-out);outline:0;
}
.tp-drawer.is-on{transform:translateX(0)}
.tp-dr-head{display:flex;align-items:flex-start;gap:12px;padding:18px 20px 14px 24px;border-bottom:1px solid var(--dna-hairline);flex:none}
.tp-dr-head .t{min-width:0;flex:1 1 auto}
.tp-dr-head .eyebrow{display:flex;align-items:center;gap:8px;font-size:11.5px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--dna-ink-3);margin-bottom:6px;flex-wrap:wrap}
.tp-dr-head .eyebrow .dna-status{letter-spacing:0;text-transform:none}
.tp-dr-head .eyebrow svg{width:14px;height:14px;stroke:var(--dna-chart);fill:none;flex:none}
.tp-dr-head h2{margin:0;font-size:18px;font-weight:600;color:var(--dna-ink);line-height:1.35;letter-spacing:-.1px}
.tp-dr-head .sub{margin:4px 0 0;font-size:12.5px;font-weight:500;color:var(--dna-ink-3);line-height:1.5}
.tp-dr-body{flex:1 1 auto;overflow-y:auto;padding:6px 24px 48px;overscroll-behavior:contain}
.tp-dr-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:8px;margin-top:16px}
.tp-dr-stats .s{padding:10px 12px;border-radius:12px;background:var(--dna-surface-2);min-width:0}
.tp-dr-stats .s .k{display:block;font-size:11px;font-weight:600;color:var(--dna-ink-3);letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tp-dr-stats .s .v{display:flex;align-items:baseline;gap:4px;margin-top:4px;font-size:20px;font-weight:650;letter-spacing:-.3px;color:var(--dna-ink);font-feature-settings:"tnum";white-space:nowrap;line-height:1.1}
.tp-dr-stats .s .v small{font-size:11.5px;font-weight:600;color:var(--dna-ink-2);letter-spacing:0}
.tp-dr-stats .s .v.late{color:var(--dna-late)}
.tp-dr-stats .s .v.up{color:var(--dna-up)}
.tp-dr-stats .s .d{display:block;margin-top:2px;font-size:11.5px;font-weight:500;color:var(--dna-ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tp-dr-sec{margin-top:22px}
.tp-dr-sec > .h{display:flex;align-items:baseline;gap:8px;margin:0 0 10px;font-size:var(--dna-fs-sub);font-weight:600;color:var(--dna-ink-2)}
.tp-dr-sec > .h b{font-size:var(--dna-fs-section);color:var(--dna-ink);font-feature-settings:"tnum"}
.tp-dr-sec > .h small{margin-left:auto;font-size:12px;font-weight:500;color:var(--dna-ink-3);white-space:nowrap}
.tp-dr-sec p{margin:0;font-size:var(--dna-fs-sub);font-weight:400;color:var(--dna-ink-2);line-height:1.7}
.tp-dr-sec p + p{margin-top:6px}
.tp-dr-sec p b{font-weight:600;color:var(--dna-ink)}
.tp-dr-box{padding:14px 16px;border-radius:12px;background:var(--dna-surface-2);font-size:var(--dna-fs-body);font-weight:500;color:var(--dna-ink);line-height:1.7}
.tp-dr-box .k{display:block;font-size:11px;font-weight:700;letter-spacing:.14em;color:var(--dna-ink-3);margin-bottom:4px}
.tp-dr-box.is-accent{background:var(--dna-pill-info-bg);color:var(--dna-ink)}
.tp-dr-kv{display:grid;grid-template-columns:96px minmax(0,1fr);gap:8px 14px;align-items:baseline}
.tp-dr-kv span{font-size:12.5px;font-weight:600;color:var(--dna-ink-3)}
.tp-dr-kv div{font-size:var(--dna-fs-sub);font-weight:500;color:var(--dna-ink);min-width:0;line-height:1.55;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tp-dr-list{display:grid;gap:2px}
.tp-dr-list .r{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:4px 10px;padding:8px 8px;border-radius:8px;min-height:40px}
.tp-dr-list .r:hover{background:var(--dna-surface-2)}
.tp-dr-list .r.is-clickable{cursor:pointer}
.tp-dr-list .r .tx{min-width:0;font-size:13.5px;font-weight:500;color:var(--dna-ink);line-height:1.45}
.tp-dr-list .r .tx small{display:block;font-size:11.5px;font-weight:500;color:var(--dna-ink-3);margin-top:1px}
.tp-dr-list .r .right{display:inline-flex;align-items:center;gap:8px;flex:none}
.tp-dr-list .r .dna-status{font-size:11px;padding:2px 8px}
.tp-dr-list .r .dna-due{font-size:12.5px}
.tp-chart{width:100%;height:auto;display:block}
.tp-chart .area{fill:url(#tp-area)}
.tp-chart .line{fill:none;stroke:var(--dna-chart);stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round}
.tp-chart .plan{fill:none;stroke:var(--dna-ink-2);stroke-width:1.5;stroke-dasharray:3 4}
.tp-chart .goal{stroke:var(--dna-ink);stroke-width:1.2;stroke-dasharray:2 4;opacity:.7}
.tp-chart .sc{fill:none;stroke-width:2;stroke-linecap:round}
.tp-chart .sc.base{stroke:var(--tp-bar-soft);stroke-dasharray:4 4}
.tp-chart .sc.opt{stroke:var(--dna-chart-green)}
.tp-chart .dot{fill:var(--dna-chart);stroke:var(--dna-surface);stroke-width:2}
.tp-chart .dot.end{fill:var(--dna-surface);stroke:var(--dna-chart);stroke-width:2.2}
.tp-chart .bar{fill:var(--tp-bar-soft)}
.tp-chart .bar.hot{fill:var(--dna-chart)}
.tp-chart .vline{stroke:var(--dna-ink-faint);stroke-width:1;stroke-dasharray:2 3}
.tp-chart .lab{font-size:11px;font-weight:600;fill:var(--dna-ink-2);font-family:var(--dna-font)}
.tp-chart .lab.faint{fill:var(--dna-ink-3);font-weight:500}
.tp-chart .lab.on{fill:var(--dna-chart)}
.tp-chart .lab.green{fill:var(--dna-up)}
.tp-chart .cap{fill:var(--dna-surface);stroke:var(--dna-border-strong)}
.tp-funnel{display:grid;gap:8px}
.tp-funnel .r{display:grid;grid-template-columns:120px minmax(0,1fr) 92px;align-items:center;gap:12px}
.tp-funnel .r .nm{font-size:13px;font-weight:600;color:var(--dna-ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tp-funnel .r .tp-bar{height:14px;border-radius:7px;overflow:visible}
.tp-funnel .r .tp-bar i{border-radius:7px}
.tp-funnel .r .v{font-size:13px;font-weight:600;color:var(--dna-ink);font-feature-settings:"tnum";white-space:nowrap;text-align:right}
.tp-funnel .r .v small{font-weight:500;color:var(--dna-ink-3)}
.tp-funnel .conv{display:grid;grid-template-columns:120px minmax(0,1fr) 92px;align-items:center;gap:12px;font-size:11.5px;font-weight:600;color:var(--dna-ink-3);padding:0 0 0 0}
.tp-funnel .conv span{grid-column:2;display:inline-flex;align-items:center;gap:6px;padding-left:4px}
.tp-funnel .conv span b{color:var(--dna-pill-info-ink)}
.tp-runway{display:grid;gap:2px;margin-top:6px;--tp-rw-l:minmax(140px,220px);--tp-rw-v:120px}
.tp-rw-axis{display:grid;grid-template-columns:var(--tp-rw-l) minmax(0,1fr) var(--tp-rw-v);gap:0 14px;align-items:end;font-size:11.5px;font-weight:600;color:var(--dna-ink-3);padding-bottom:4px}
.tp-rw-axis .ax{position:relative;height:16px}
.tp-rw-axis .ax span{position:absolute;bottom:0;white-space:nowrap}
.tp-rw-axis .ax .z{left:0}
.tp-rw-axis .ax .g{right:0;transform:translateX(40%);color:var(--dna-ink);font-weight:600}
.tp-rw-row{display:grid;grid-template-columns:var(--tp-rw-l) minmax(0,1fr) var(--tp-rw-v);gap:0 14px;align-items:center;min-height:52px;padding:6px 0;border-top:1px solid var(--dna-hairline)}
.tp-rw-row:first-of-type{border-top:0}

      if (act) body.push(sec(["前回の会議で決めたアクション"], fmtMDW(pd(D.last_meeting.date)), [el("p", {}, [el("b", { text: act.text }), "（期限 " + fmtMD(pd(act.due)) + "）"]), act.dod ? el("p", { text: "完了の定義: " + act.dod }) : null]));
      openDrawer({ eyebrow: [icon("check"), "タスク", pill(t.state, null, true)], title: t.text, sub: w ? "束: " + w.name : null, body: body });
    }
    /* 成果物の束の詳細 */
    function openWP(w) {
      var done = w.state === "完了", d = pd(w.due), rem = d ? days(X.today, d) : null, ph = X.phaseOf(w.due), tasks = X.tasksOfWp(w.id);
      var body = [];
      body.push(stats([stat("期限", fmtMD(d), null, ph ? "フェーズ " + ph.no + " " + ph.name : null), done ? stat("余日", "完了", null, null, "up") : rem != null ? stat(rem < 0 ? "遅れ" : "余日", Math.abs(rem), "日", rem < 0 ? "期限を過ぎている" : "今日から期限まで", rem < 0 ? "late" : null) : null, stat("状態", w.state), stat("タスク", tasks.length, "件", tasks.length ? "遅れ " + tasks.filter(X.isLate).length : "現役の紐づけなし")]));
      var people = { A: [], R: [], C: [], I: [] }; X.members.forEach(function (m) { var v = (m.raci || {})[w.id]; if (v && people[v]) people[v].push(m.name); });
      body.push(sec(["関わる人"], "A＝責任者 ・ R＝実行 ・ C＝相談 ・ I＝共有", [kv([["責任者 A", people.A.length ? people.A.map(function (n) { return who(n, 22); }) : [w.lead]], ["実行 R", people.R.length ? people.R.map(function (n) { return who(n, 22); }) : ["—"]], ["相談 C", [people.C.length ? people.C.join("・") : "—"]], ["共有 I", [people.I.length ? people.I.join("・") : "—"]]])]));
      body.push(sec(["この束のタスク ", el("b", { text: tasks.length })], "期限順", [tasks.length ? drList(tasks.slice().sort(function (a, b) { return String(a.due).localeCompare(String(b.due)); }).map(taskRowLite)) : el("p", { class: "tp-note", style: "margin:0", text: "現役のタスクはありません（完了・中止は一覧に載りません）。" })]));
      openDrawer({ eyebrow: [icon("gantt"), "成果物の束", pill(w.state, null, true)], title: w.name, sub: "責任者 " + w.lead + " ・ 期限 " + fmtMD(d), body: body });
    }
    /* メンバーの詳細 */
    function openMember(m) {
      var mine = X.tasks.filter(function (t) { return t.owner === m.name; }).sort(function (a, b) { return String(a.due).localeCompare(String(b.due)); });
      var late = mine.filter(X.isLate), kdi = (D.kdi || []).filter(function (k) { return k.owner === m.name; }), cond = memberCond(m), s = raciSplit(m.raci), LM = D.last_meeting;
      var kdiDone = kdi.filter(function (k) { return k.actual >= k.target; }).length;
      var body = [];
      body.push(stats([stat("現役タスク", mine.length, "件", counts(mine)["進行中"] ? "進行中 " + counts(mine)["進行中"] : null), stat("遅れ", late.length, "件", late.length ? "期限を過ぎた" : "なし", late.length ? "late" : "up"), stat(X.monthKey + "の稼働", (m.load || {})[X.monthKey] != null ? m.load[X.monthKey] : "—", "%", m.load_note || null), kdi.length ? stat("今週の行動量", kdiDone + " / " + kdi.length, "件", "目標に届いた行動", kdiDone === kdi.length ? "up" : "late") : null]));
      body.push(sec(["持っているタスク ", el("b", { text: mine.length })], "期限順", [mine.length ? drList(mine.map(taskRowLite)) : el("p", { class: "tp-note", style: "margin:0", text: "現役のタスクはありません。" })]));
      if (kdi.length) body.push(sec(["今週の行動量（KDI）"], "自分で動かせる行動の数", [kdiRows(kdi)]));
      function wpBtn(id) { var w = X.wpById[id], b = el("button", { type: "button", class: "tp-link", text: wpLabel(id) }); if (w) b.addEventListener("click", function () { openWP(w); }); return b; }
      body.push(sec(["担当の束"], "A＝責任者 ・ R＝実行 ・ C＝相談 ・ I＝共有", [kv([["責任者 A", s.a.length ? s.a.map(wpBtn) : ["—"]], ["実行 R", s.r.length ? s.r.map(wpBtn) : ["—"]], ["相談 C", [s.c.length ? s.c.map(wpLabel).join("・") : "—"]], ["共有 I", [s.i.length ? s.i.map(wpLabel).join("・") : "—"]]])]));
      body.push(sec(["稼働（月別）"], "その人の時間のうち、このプロジェクトに使う割合", [el("div", { style: "max-width:320px" }, loadSvg(m.load)), m.load_note ? el("p", { text: m.load_note }) : null]));
      if (m.stakeholder) { var sh = m.stakeholder; body.push(sec(["関与と次の一手"], null, [el("p", {}, [el("b", { text: "関与 " }), sh.engagement + (sh.engagement_desired && sh.engagement_desired !== sh.engagement ? " → 望ましい: " + sh.engagement_desired : "（望ましい水準）") + " ・ 影響力 " + sh.influence + " ・ 関心 " + sh.interest]), sh.next_step ? el("p", {}, [el("b", { text: "次の一手 " }), stripIds(sh.next_step)]) : null])); }
      if (LM) {
        var rv = (LM.review || []).filter(function (r) { return r.owner === m.name; }), ac = (LM.actions || []).filter(function (a) { return a.owner === m.name; });
        if (rv.length || ac.length) body.push(sec(["前回の会議の自分のぶん"], fmtMDW(pd(LM.date)), [drList(rv.map(function (r) { return drRow(["検収: " + r.task], [pill(r.state, null, true)]); }).concat(ac.map(function (a) { var t = a.task ? X.taskById[a.task] : null; return drRow([a.text, el("small", { text: "期限 " + fmtMD(pd(a.due)) })], [t ? pill(t.state, null, true) : a.task ? pill("現役一覧外", "is-neutral", true) : pill("タスク未登録", "warn", true)], t ? function () { openTask(t); } : null); })))]));
      }
      openDrawer({ eyebrow: [icon("people"), "メンバー", pill(cond.label, cond.cls, true)], title: m.name, sub: stripIds(m.role), body: body });
    }

    /* ---------- 脚 ---------- */
    function glossaryFold() {
      var G = [
        ["KGI", "最終目標。この計画で最後に達成する1つの数"], ["KPI", "途中の数字。最終目標に届くかを手前で測る"], ["KDI", "今週の行動量。自分たちで動かせる行動の数"],
        ["律速", "全体の速さを決めている一段（いま一番詰まっている所）。ここを直さないと他を足しても速くならない"],
        ["着地", "いまのまま、またはその案を採ったときに、期限の日に届く数（試算）"], ["今日までの予定", "計画どおりに進んでいれば、今日の時点で届いているはずの数"],
        ["余日", "今日から期限までの日数。マイナスなら遅れ"], ["束（WP）", "成果物のかたまり。関係するタスクをまとめた単位"],
        ["A ／ R ／ C ／ I", "A＝その束の説明責任を持つ人（各束1人）／ R＝実行する人 ／ C＝相談を受ける人 ／ I＝結果を共有される人"],
        ["決めたこと", "会議で確定し、記録に残した判断"], ["リスク", "まだ起きていないが、起きると計画に響くこと"], ["課題", "すでに起きていて、いま対応しているつまずき"],
        ["検収", "前回決めたことが終わったかを、次の会議の最初に確かめること"], ["実行率", "完了したタスク ÷ 期限が来たタスク"],
        ["稼働", "その人の時間のうち、このプロジェクトに使う割合"], ["鮮度", "その数字がいつ時点のものか"], ["投影", "正本を映しただけの画面。ここを直しても正本は変わらない"]
      ];
      var dl = el("div", { class: "tp-glist" });
      G.forEach(function (g) { dl.appendChild(el("div", {}, [el("b", { text: g[0] }), el("span", { text: g[1] })])); });
      var body = [dl];
      if (D.headline && D.headline.update_rule) body.push(el("p", { style: "margin-top:10px", text: D.headline.update_rule }));
      return fold("ことば（この画面に出る言葉の意味）", body);
    }
    function renderFooter(host) {
      clear(host);
      host.appendChild(el("div", { class: "tp-fold tp-gloss-wrap" }, glossaryFold()));
      append(host, [
        el("span", { "data-sample-only": "" }, ["データは", el("b", { text: SAMPLE_WORD }), "です（数値・人名はすべて" + SAMPLE_WORD2 + "）。業務判断には使えません。正本を自分たちの値に替えて作り直すと、この画面が自分たちの数字になります。"]),
        el("br", { "data-sample-only": "" }),
        el("span", { text: "画面の作り直し日 " + (D.meta && D.meta.generated_at ? D.meta.generated_at : "—") + " ・ 基準日 " + fmtYMD(X.today) + " ・ この画面は投影で、正本は " + (D.project.org || "") + " のプロジェクト記録です。" })
      ]);
    }
  }
