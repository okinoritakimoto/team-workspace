<!--
  プロジェクトの運転席（投影） — 手で書き換えない。
  生成元の正本: 20_project/（計器盤 03_dashboard.md ほか）。
    データ層（id が dashboard-data の application/json ブロック）は tools/build_dashboard.py が正本から生成する（元の数だけ・派生値なし）。
    表示層（この HTML/CSS/JS）が達成%・実行率・必要ペース・今日までの予定・遅れ・週番号・着地の見込み・持ちタスク数を計算する。
    表示層は JSON 以外を読まない（軸の上限など描画用の定数だけを持つ）。
  トークンの出所: Design DNA v2.8（dna.css）の写し — 正本ではない（正本は支援側が管理する）。
-->
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>プロジェクト運転席</title>
<style>
/* ============================================================
   1. トークン（Design DNA v2.8 dna.css の写し — :root 1か所）
   ============================================================ */
:root{
  --dna-bg:#ffffff; --dna-surface:#ffffff; --dna-surface-2:#f7f8fa;
  --dna-border:rgba(18,20,26,.07); --dna-border-strong:rgba(18,20,26,.13);
  --dna-hairline:#f2f3f5; --dna-hairline-crisp:rgba(18,20,26,.12); --dna-badge-bg:#ececee;
  --dna-tab-on-bg:#e8f1fa; --dna-tab-on-ink:#10395c;
  --dna-tb-face:rgba(18,90,140,.05); --dna-tb-face-hover:rgba(18,90,140,.1);
  --dna-tb-line:rgba(18,90,140,.15); --dna-tb-line-soft:rgba(18,90,140,.1);
  --dna-radius-lg:22px; --dna-radius:16px; --dna-radius-sm:10px;
  --dna-shadow:0 1px 2px rgba(16,18,26,.04),0 10px 30px rgba(16,18,26,.055);
  --dna-shadow-hover:0 2px 4px rgba(16,18,26,.05),0 16px 40px rgba(16,18,26,.09);
  --dna-ink:#191a1c; --dna-ink-2:#5c6066; --dna-ink-3:#767b82; --dna-ink-faint:#b9bcc2;
  --dna-up:#12833f; --dna-down:#d93025; --dna-link:#1a6ef5; --dna-chart:#3e83f8; --dna-chart-soft:#aac6f7; --dna-late:#c4554d;
  --dna-pill-up-bg:#e5f5eb; --dna-pill-up-ink:#0f7a39;
  --dna-pill-warn-bg:#fdf1dc; --dna-pill-warn-ink:#a05f00;
  --dna-pill-down-bg:#fdeae8; --dna-pill-down-ink:#c22b20;
  --dna-pill-info-bg:#e7effe; --dna-pill-info-ink:#1a5fd0;
  --dna-pill-neutral-bg:#eef0f2;
  --dna-chart-green:#22a04d; --dna-chart-band:#e2ebfc;
  --dna-control-on:var(--dna-link); --dna-control-off:#d4d7dc; --dna-progress-track:#eef0f3;
  --dna-grad-a:#2f7bf2; --dna-grad-b:#35c3e8;
  --dna-grad-h:linear-gradient(90deg,var(--dna-grad-a),var(--dna-grad-b));
  --dna-grad-ring:linear-gradient(135deg,var(--dna-grad-a),var(--dna-grad-b) 85%);
  --dna-btn-grad:linear-gradient(135deg,#2464ec,#0d7cad); --dna-btn-grad-ink:#ffffff;
  --dna-font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI","Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;
  --dna-fs-title:21px; --dna-fs-section:16px; --dna-fs-subject:15px; --dna-fs-body:14px; --dna-fs-sub:13.5px; --dna-fs-small:12.5px; --dna-fs-hero:27px;
  --dna-gap:16px; --dna-pad:20px 22px;
  --dna-motion-fast:.15s; --dna-motion-base:.18s; --dna-motion-slow:.34s;
  --dna-ease-out:cubic-bezier(.2,0,0,1); --dna-ease-inout:cubic-bezier(.4,0,.2,1);
  /* 描画用（page-local） */
  --tp-ava-bg:#ccd9ef; --tp-ava-ink:#2f4a7d; --tp-minibar:#e9eaee; --tp-grid:#eeeff2;
  --tkb-lane-shadow:0 1px 2px rgba(16,18,26,.04),0 8px 22px rgba(16,18,26,.05);
  --tkb-card-shadow-hover:0 2px 4px rgba(16,18,26,.05),0 10px 24px rgba(16,18,26,.09);
  --tkb-lane-gap:14px; --tkb-lane-width:minmax(0,1fr);
}
html[data-color-theme="dark"]{
  --dna-bg:#1b1c1f; --dna-surface:#232428; --dna-surface-2:#2b2c31;
  --dna-border:rgba(255,255,255,.09); --dna-border-strong:rgba(255,255,255,.16);
  --dna-hairline:rgba(255,255,255,.07); --dna-hairline-crisp:rgba(255,255,255,.12); --dna-badge-bg:#3a3b3f;
  --dna-tab-on-bg:rgba(255,255,255,.1); --dna-tab-on-ink:#e8eaed;
  --dna-tb-face:rgba(255,255,255,.08); --dna-tb-face-hover:rgba(255,255,255,.12);
  --dna-tb-line:rgba(255,255,255,.16); --dna-tb-line-soft:rgba(255,255,255,.08);
  --dna-shadow:0 1px 2px rgba(0,0,0,.3),0 12px 34px rgba(0,0,0,.35);
  --dna-shadow-hover:0 2px 4px rgba(0,0,0,.35),0 18px 44px rgba(0,0,0,.45);
  --dna-ink:#e8eaed; --dna-ink-2:#9aa0a6; --dna-ink-3:#80868b; --dna-ink-faint:#5f6368;
  --dna-up:#81c995; --dna-down:#f28b82; --dna-link:#8ab4f8; --dna-chart:#8ab4f8; --dna-chart-soft:#4a5b78; --dna-late:#f28b82;
  --dna-pill-up-bg:rgba(129,201,149,.16); --dna-pill-up-ink:#81c995;
  --dna-pill-warn-bg:rgba(253,214,99,.14); --dna-pill-warn-ink:#fdd663;
  --dna-pill-down-bg:rgba(242,139,130,.15); --dna-pill-down-ink:#f28b82;
  --dna-pill-info-bg:rgba(138,180,248,.16); --dna-pill-info-ink:#8ab4f8;
  --dna-pill-neutral-bg:rgba(255,255,255,.09);
  --dna-chart-band:rgba(138,180,248,.22);
  --dna-control-off:#4a4d52; --dna-progress-track:#2c2d31;
  --dna-grad-a:#6ba4f8; --dna-grad-b:#58c8e6;
  --dna-btn-grad:linear-gradient(135deg,#6ba4f8,#58c8e6); --dna-btn-grad-ink:#17181a;
  --tp-ava-bg:#3a4a63; --tp-ava-ink:#cdd9ee; --tp-minibar:#3a3b3f; --tp-grid:#2c2d31;
  --tkb-lane-shadow:0 1px 2px rgba(0,0,0,.3),0 10px 26px rgba(0,0,0,.34);
  --tkb-card-shadow-hover:0 2px 4px rgba(0,0,0,.35),0 12px 28px rgba(0,0,0,.42);
}

/* ============================================================
   2. 地・床（操作の床 = dna.css §10 の写し）
   ============================================================ */
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
html{background:var(--dna-bg)}
body{
  font-family:var(--dna-font);color:var(--dna-ink);background:var(--dna-bg);
  font-size:var(--dna-fs-body);font-weight:500;line-height:1.55;letter-spacing:0;
  font-feature-settings:"tnum";-webkit-font-smoothing:antialiased;overflow-x:hidden;
}
[hidden]{display:none !important}
html[data-live] [data-sample-only]{ display:none !important; }
a{color:var(--dna-link)}
b,strong{font-weight:600}
button{font-family:inherit}
:where(button,a,input,select,textarea,[tabindex]:not([tabindex="-1"])):focus-visible{outline:2px solid var(--dna-chart-soft);outline-offset:1px}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{transition-duration:.01ms !important;animation-duration:.01ms !important}
}
mark{background:var(--dna-pill-info-bg);color:inherit;border-radius:4px;padding:0 3px}
.tp-num{font-feature-settings:"tnum";font-variant-numeric:tabular-nums}
.tp-vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ============================================================
   3. 器（キャンバス・題・切り替え行・脚）
   ============================================================ */
.dna-canvas{max-width:1240px;margin:0 auto;padding:18px 20px 72px;position:relative}
.tp-errband{
  display:flex;align-items:center;gap:10px;margin:0 0 14px;padding:12px 16px;border-radius:12px;
  background:var(--dna-pill-down-bg);color:var(--dna-pill-down-ink);font-size:var(--dna-fs-sub);font-weight:600;line-height:1.5;
  box-shadow:inset 0 0 0 1px rgba(194,43,32,.25);
}
body.is-broken main{display:none}
.tp-head{display:flex;align-items:flex-start;gap:16px;flex-wrap:wrap}
.tp-head-l{flex:1 1 420px;min-width:0}
.tp-title{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:0;font-size:var(--dna-fs-title);font-weight:600;letter-spacing:.01em;line-height:1.3}
.tp-title .dna-status{font-size:12.5px}
.tp-sub{margin:6px 0 0;font-size:var(--dna-fs-sub);font-weight:500;color:var(--dna-ink-3);display:flex;flex-wrap:wrap;gap:4px 0}
.tp-sub .sep{margin:0 8px;color:var(--dna-ink-faint)}
.tp-sub b{font-weight:600;color:var(--dna-ink-2)}
.tp-head-r{display:inline-flex;align-items:center;gap:10px;flex:none;padding-top:2px}
.tp-nav{
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:14px 0 0;
  padding-bottom:8px;border-bottom:1px solid var(--dna-tb-line-soft);
}
.tp-scope{margin-left:auto;display:inline-flex;align-items:center;gap:8px;font-size:var(--dna-fs-sub);font-weight:600;color:var(--dna-ink-2)}
.tp-select{
  font-family:var(--dna-font);font-size:var(--dna-fs-sub);font-weight:600;color:var(--dna-ink);
  background:var(--dna-surface);border:1px solid var(--dna-border-strong);border-radius:var(--dna-radius-sm);
  padding:6px 30px 6px 10px;appearance:none;-webkit-appearance:none;max-width:220px;cursor:pointer;
  background-image:linear-gradient(45deg,transparent 50%,var(--dna-ink-3) 50%),linear-gradient(135deg,var(--dna-ink-3) 50%,transparent 50%);
  background-position:calc(100% - 15px) 55%,calc(100% - 10px) 55%;background-size:5px 5px,5px 5px;background-repeat:no-repeat;
}
.tp-headline{
  display:flex;align-items:flex-start;gap:10px;flex-wrap:wrap;margin:12px 0 0;
  font-size:var(--dna-fs-body);font-weight:500;color:var(--dna-ink);line-height:1.55;
}
.tp-headline .k{flex:none;font-size:var(--dna-fs-small);font-weight:600;color:var(--dna-ink-3);letter-spacing:.04em;padding-top:2px}
.tp-headline .t{flex:1 1 320px;min-width:0}
.tp-headline .t b{font-weight:600}
.tp-headline .more{flex:none}
.tp-foot{margin:28px 0 0;padding-top:14px;border-top:1px solid var(--dna-hairline);font-size:var(--dna-fs-small);font-weight:500;color:var(--dna-ink-3);line-height:1.7}
.tp-gloss-wrap{margin:0 0 10px}
.tp-gloss{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:4px 22px;padding-top:2px}
.tp-gloss > div{display:grid;grid-template-columns:104px minmax(0,1fr);gap:10px;padding:5px 0;border-bottom:1px solid var(--dna-hairline);font-size:13px;line-height:1.5}
.tp-gloss b{font-weight:600;color:var(--dna-ink)}
.tp-gloss span{color:var(--dna-ink-2);font-weight:400}
.tp-foot b{font-weight:600;color:var(--dna-ink-2)}
main > section{margin-top:14px}

/* ============================================================
   4. DNA 部品（dna.css の該当規則を page-local へ写し・scope は .dna-canvas）
   ============================================================ */
/* 白カード（§5） */
.dna-canvas .dna-card{
  background:var(--dna-surface);border:1px solid var(--dna-border);border-radius:var(--dna-radius);
  box-shadow:var(--dna-shadow);padding:var(--dna-pad);min-width:0;
  transition:box-shadow var(--dna-motion-base) ease;
}
.dna-canvas .dna-card:hover{box-shadow:var(--dna-shadow-hover)}
.dna-canvas .dna-metric-label{display:inline-flex;align-items:center;gap:7px;font-size:var(--dna-fs-sub);font-weight:600;color:var(--dna-ink-2)}
.dna-canvas .dna-metric-label svg{width:15px;height:15px;stroke:var(--dna-ink-3);fill:none;flex:none}
.dna-canvas .dna-metric-label .u{border-bottom:1px dotted var(--dna-ink-faint);padding-bottom:2px}
/* KPI（§5） */
.dna-canvas .dna-kpi-body{display:flex;align-items:flex-end;justify-content:space-between;gap:10px 12px;margin-top:10px;flex-wrap:wrap}
.dna-canvas .dna-kpi-value{display:flex;align-items:baseline;gap:8px;min-width:0}
.dna-canvas .dna-kpi-value b{font-size:var(--dna-fs-hero);font-weight:650;letter-spacing:-.4px;color:var(--dna-ink);white-space:nowrap}
.dna-canvas .dna-kpi-value .unit{font-size:15px;font-weight:600;color:var(--dna-ink-2)}
.dna-canvas .dna-delta{font-size:13px;font-weight:600;white-space:nowrap;color:var(--dna-ink-3)}
.dna-canvas .dna-delta.up{color:var(--dna-up)}
.dna-canvas .dna-delta.down{color:var(--dna-down)}
/* 状態ピル（§9） */
.dna-canvas .dna-status{display:inline-flex;align-items:center;border-radius:999px;font-size:12.5px;font-weight:600;padding:4px 11px;line-height:1.4;white-space:nowrap}
.dna-canvas .dna-status.up{background:var(--dna-pill-up-bg);color:var(--dna-pill-up-ink)}
.dna-canvas .dna-status.warn{background:var(--dna-pill-warn-bg);color:var(--dna-pill-warn-ink)}
.dna-canvas .dna-status.down{background:var(--dna-pill-down-bg);color:var(--dna-pill-down-ink)}
.dna-canvas .dna-status.info{background:var(--dna-pill-info-bg);color:var(--dna-pill-info-ink)}
.dna-canvas .dna-status.is-neutral{background:var(--dna-pill-neutral-bg);color:var(--dna-ink-2)}
.dna-canvas .dna-status.is-review{gap:6px;background:var(--dna-surface);color:var(--dna-link);box-shadow:inset 0 0 0 1.5px rgba(26,110,245,.35)}
.dna-canvas .dna-status.is-review i{width:5px;height:5px;border-radius:50%;flex:none;background:var(--dna-surface);border:2px solid var(--dna-link)}
html[data-color-theme="dark"] .dna-canvas .dna-status.is-review{box-shadow:inset 0 0 0 1.5px rgba(138,180,248,.45)}
/* カテゴリタグ（§11） */
.dna-canvas .dna-tag{display:inline-flex;align-items:center;font-size:12.5px;font-weight:600;border-radius:7px;padding:4px 10px;line-height:1.4;white-space:nowrap}
.dna-canvas .dna-tag.t-blue{background:var(--dna-pill-info-bg);color:var(--dna-pill-info-ink)}
.dna-canvas .dna-tag.t-green{background:var(--dna-pill-up-bg);color:var(--dna-pill-up-ink)}
.dna-canvas .dna-tag.t-amber{background:var(--dna-pill-warn-bg);color:var(--dna-pill-warn-ink)}
.dna-canvas .dna-tag.t-neutral{background:var(--dna-pill-neutral-bg);color:var(--dna-ink-2)}
/* ボタン（§4） */
.dna-canvas button.dna-btn{
  display:inline-flex;align-items:center;gap:7px;font-family:var(--dna-font);font-size:var(--dna-fs-sub);font-weight:600;
  color:var(--dna-ink);background:var(--dna-surface);border:1px solid var(--dna-border-strong);border-radius:var(--dna-radius-sm);
  padding:8px 14px;cursor:pointer;line-height:1.2;box-shadow:0 1px 2px rgba(16,18,26,.04);
  transition:background .15s ease,box-shadow .15s ease;
}
.dna-canvas button.dna-btn:hover{background:var(--dna-surface-2);box-shadow:0 2px 6px rgba(16,18,26,.08)}
.dna-canvas button.dna-btn svg{width:16px;height:16px;stroke:var(--dna-ink-2);fill:none;flex:none}
/* アバター（xc-ava16・zkc-avatar の段） */
.dna-canvas .xc-ava16{width:16px;height:16px;border-radius:50%;flex:none;background:var(--tp-ava-bg);color:var(--tp-ava-ink);display:inline-grid;place-items:center;font-size:9.5px;font-weight:600;line-height:1}
.dna-canvas .tp-ava{width:22px;height:22px;border-radius:50%;flex:none;background:var(--tp-ava-bg);color:var(--tp-ava-ink);display:inline-grid;place-items:center;font-size:11.5px;font-weight:600;line-height:1}
.dna-canvas .tp-ava40{width:40px;height:40px;border-radius:50%;flex:none;background:var(--tp-ava-bg);color:var(--tp-ava-ink);display:grid;place-items:center;font-size:15px;font-weight:600;line-height:1}
.dna-canvas .tp-who{display:inline-flex;align-items:center;gap:6px;min-width:0;font-size:13px;font-weight:500;color:var(--dna-ink);white-space:nowrap}
.dna-canvas .tp-who small{font-size:13px;overflow:hidden;text-overflow:ellipsis;min-width:0}
/* 作業面ツールバー（§11 .dna-tb-*） */
.dna-canvas .dna-tb-bar{display:flex;align-items:center;gap:10px;width:100%;flex-wrap:wrap;padding-bottom:8px;border-bottom:1px solid var(--dna-tb-line-soft)}
.dna-canvas .dna-tb-views{display:inline-flex;align-items:center;gap:2px}
.dna-canvas .dna-tb-view{
  display:inline-flex;align-items:center;gap:7px;font-family:var(--dna-font);font-size:13.5px;font-weight:600;color:var(--dna-ink-2);
  background:transparent;border:0;border-radius:7px;padding:7px 12px;cursor:pointer;text-decoration:none;
  transition:background .15s ease,color .15s ease;
}
.dna-canvas .dna-tb-view svg{width:15px;height:15px;stroke:currentColor;fill:none;opacity:.85}
.dna-canvas .dna-tb-view:hover{background:rgba(18,90,140,.06);color:var(--dna-ink)}
html[data-color-theme="dark"] .dna-canvas .dna-tb-view:hover{background:rgba(138,180,248,.1)}
.dna-canvas .dna-tb-view.on{background:var(--dna-tab-on-bg);color:var(--dna-tab-on-ink)}
.dna-canvas .dna-tb-right{margin-left:auto;display:inline-flex;align-items:center;gap:4px;flex-wrap:wrap}
.dna-canvas .dna-tb-count{font-size:12.5px;font-weight:600;color:var(--dna-ink-3);font-feature-settings:"tnum";white-space:nowrap;margin:0 4px 0 6px}
.dna-canvas .dna-tb-sample{
  display:inline-flex;align-items:center;gap:5px;margin-left:6px;font-size:11.5px;font-weight:600;color:var(--dna-pill-warn-ink);
  background:var(--dna-pill-warn-bg);border-radius:7px;padding:4px 9px;white-space:nowrap;box-shadow:inset 0 0 0 1px rgba(168,101,0,.28);cursor:help;
}
html[data-color-theme="dark"] .dna-canvas .dna-tb-sample{box-shadow:inset 0 0 0 1px rgba(253,214,99,.3)}
.dna-canvas .dna-tb-chips{display:flex;align-items:center;gap:7px;flex-wrap:wrap;width:100%;margin-top:9px}
.dna-canvas .dna-tb-chip{
  display:inline-flex;align-items:center;gap:6px;font-family:var(--dna-font);font-size:12.5px;font-weight:600;line-height:1;color:var(--dna-ink);
  background:var(--dna-tb-face);border:1px solid transparent;border-radius:999px;padding:5.5px 11px;cursor:pointer;white-space:nowrap;
  transition:background .15s ease;
}
.dna-canvas .dna-tb-chip:hover{background:var(--dna-tb-face-hover)}
.dna-canvas .dna-tb-chip .k{font-weight:500;color:var(--dna-ink-3)}
.dna-canvas .dna-tb-chip .n{font-weight:500;color:var(--dna-ink-3);font-feature-settings:"tnum"}
.dna-canvas .dna-tb-chip.active{
  border:1px solid transparent;padding:5.5px 11px;color:var(--dna-pill-info-ink);
  background:linear-gradient(var(--dna-surface),var(--dna-surface)) padding-box,var(--dna-grad-ring) border-box;
}
html[data-color-theme="dark"] .dna-canvas .dna-tb-chip.active{color:#8ab4f8}
.dna-canvas .dna-tb-chip.ghost{color:var(--dna-ink-faint);font-weight:500}
.dna-canvas .tp-tb-sep{width:1px;height:18px;background:var(--dna-tb-line);margin:0 4px}
.dna-canvas .tp-tb-select{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:500;color:var(--dna-ink-3)}
.dna-canvas .tp-tb-select .tp-select{font-size:12.5px;padding:4px 26px 4px 9px;border-radius:999px;border-color:transparent;background-color:var(--dna-tb-face)}
/* 開閉（§11 .dna-fold の機構を薄い行へ — page-local .tp-fold） */
.dna-canvas .tp-fold{margin-top:8px}
.dna-canvas button.tp-fold-row{
  display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 8px 0 4px;margin-left:-4px;border:0;border-radius:8px;
  background:transparent;font:inherit;font-size:var(--dna-fs-small);font-weight:600;color:var(--dna-ink-2);cursor:pointer;text-align:left;
  transition:background .15s ease;
}
.dna-canvas button.tp-fold-row:hover{background:var(--dna-surface-2)}
.dna-canvas .tp-fold-row .chev{width:14px;height:14px;flex:none;color:var(--dna-ink-3);transition:transform .2s ease;stroke:currentColor;fill:none}
.dna-canvas .tp-fold.is-open .tp-fold-row .chev{transform:rotate(90deg)}
.dna-canvas .tp-fold-body{display:grid;grid-template-rows:0fr;transition:grid-template-rows var(--dna-motion-slow) cubic-bezier(.3,.9,.35,1)}
.dna-canvas .tp-fold.is-open .tp-fold-body{grid-template-rows:1fr}
.dna-canvas .tp-fold-body .inner{min-height:0;overflow:hidden}
.dna-canvas .tp-fold.is-open .tp-fold-body .inner{padding:4px 0 6px 2px}
.dna-canvas .tp-fold-body .li{display:flex;gap:12px;align-items:baseline;padding:3px 0}
.dna-canvas .tp-fold-body .li span{flex:none;width:84px;font-size:var(--dna-fs-small);font-weight:600;color:var(--dna-ink-3)}
.dna-canvas .tp-fold-body .li b{font-size:var(--dna-fs-sub);font-weight:500;color:var(--dna-ink);min-width:0}
.dna-canvas .tp-fold-body p{margin:0;font-size:var(--dna-fs-sub);font-weight:400;color:var(--dna-ink-2);line-height:1.6}
/* 期限の遅れ（§11 .dna-due） */
.dna-canvas .dna-due{display:inline-flex;align-items:baseline;gap:5px;font-size:14px;font-weight:500;color:var(--dna-ink);font-feature-settings:"tnum";white-space:nowrap}
.dna-canvas .dna-due .late{font-size:11.5px;font-weight:600;color:var(--dna-late);font-style:normal}
.dna-canvas .dna-due.is-done{color:var(--dna-ink-faint)}
/* セクション見出し行 eyebrow（§11d） */
.dna-canvas .dna-eyebrow-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;min-height:30px;margin:18px 0 10px}
.dna-canvas .dna-eyebrow-row > .right{margin-left:auto;display:inline-flex;align-items:center;gap:10px;flex-wrap:wrap}
.dna-canvas .dna-eyebrow{display:inline-flex;align-items:center;gap:7px;min-width:0;margin:0;font:700 11.5px/1 var(--dna-font);letter-spacing:.24em;text-transform:uppercase;color:var(--dna-ink-3);white-space:nowrap}
.dna-canvas .dna-eyebrow svg{width:14px;height:14px;flex:none;stroke:var(--dna-chart);fill:none}
.dna-canvas .dna-eyebrow .sub{font-weight:500;letter-spacing:.12em;color:var(--dna-ink-faint);text-transform:none;overflow:hidden;text-overflow:ellipsis}
/* 読ませる表・薄行版（§11/§11b .dna-t2.is-dense） */
.dna-canvas .dna-t2-card{padding:8px 8px 2px;overflow:hidden;width:100%}
.dna-canvas .dna-t2-scroll{width:100%;overflow-x:auto}
.dna-canvas .dna-t2{--dna-t2-cols:36px minmax(0,1.7fr) minmax(150px,0.9fr) 118px 120px minmax(0,1fr);min-width:900px}
.dna-canvas .dna-t2-row > *{min-width:0}
.dna-canvas .dna-t2-row .tp-who{max-width:100%}
.dna-canvas .dna-t2-head{display:grid;grid-template-columns:var(--dna-t2-cols);align-items:center;height:36px;padding:0 8px;background:var(--dna-surface-2);border-radius:10px}
.dna-canvas .dna-t2-head span{display:inline-flex;align-items:center;gap:7px;font-size:13.5px;font-weight:500;color:var(--dna-ink-3)}
.dna-canvas .dna-t2-row{display:grid;grid-template-columns:var(--dna-t2-cols);align-items:center;min-height:43px;padding:0 8px;border-bottom:1px solid var(--dna-hairline-crisp);transition:background .13s ease}
.dna-canvas .dna-t2-row:hover{background:var(--dna-surface-2)}
.dna-canvas .dna-t2-row.is-me{box-shadow:inset 3px 0 0 var(--dna-chart)}
.dna-canvas .dna-t2 .dna-status{font-size:11px;padding:2.5px 8px}
.dna-canvas .dna-t2 .dna-due{font-size:13px}
.dna-canvas .xc-comp{display:flex;align-items:center;gap:10px;min-width:0;padding-right:14px}
.dna-canvas .xc-comp .n{font-size:13.5px;font-weight:500;color:var(--dna-ink);min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dna-canvas .xc-desc{font-size:13.5px;font-weight:400;color:var(--dna-ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:14px}
.dna-canvas .tp-t2-detail{grid-column:1 / -1;padding:2px 8px 12px 44px;border-bottom:1px solid var(--dna-hairline-crisp);background:var(--dna-surface-2)}
.dna-canvas .tp-t2-detail .li{display:flex;gap:12px;align-items:baseline;padding:3px 0}
.dna-canvas .tp-t2-detail .li span{flex:none;width:84px;font-size:var(--dna-fs-small);font-weight:600;color:var(--dna-ink-3)}
.dna-canvas .tp-t2-detail .li b{font-size:var(--dna-fs-sub);font-weight:500;color:var(--dna-ink);min-width:0}
.dna-canvas button.tp-rowtgl{
  width:26px;height:26px;padding:0;border:0;border-radius:7px;background:transparent;color:var(--dna-ink-3);cursor:pointer;display:inline-grid;place-items:center;
  transition:background .15s ease,color .15s ease;
}
.dna-canvas button.tp-rowtgl:hover{background:var(--dna-surface);color:var(--dna-ink)}
.dna-canvas button.tp-rowtgl svg{width:14px;height:14px;stroke:currentColor;fill:none;transition:transform .2s ease}
.dna-canvas button.tp-rowtgl[aria-expanded="true"] svg{transform:rotate(90deg)}
.dna-canvas .dna-t2-foot{margin:0;padding:12px 10px 10px;font-size:12.5px;font-weight:500;color:var(--dna-ink-3);line-height:1.7}
/* 看板（§11c .tkb-*） */
.dna-canvas .tkb-kan{
  display:grid;grid-auto-flow:column;grid-auto-columns:var(--tkb-lane-width);gap:var(--tkb-lane-gap);align-items:start;
  margin-top:12px;overflow-x:auto;padding-bottom:8px;scrollbar-width:thin;scrollbar-color:var(--dna-chart-soft) transparent;
}
.dna-canvas .tkb-kan::-webkit-scrollbar{height:7px}
.dna-canvas .tkb-kan::-webkit-scrollbar-thumb{background:var(--dna-chart-soft);border-radius:999px}
.dna-canvas .tkb-col{display:flex;flex-direction:column;min-width:0;background:var(--dna-surface);border:1px solid var(--dna-border);border-radius:12px;box-shadow:var(--tkb-lane-shadow);overflow:hidden}
.dna-canvas .tkb-col-rail{height:3px;flex:0 0 auto}
.dna-canvas .tkb-col.is-todo .tkb-col-rail{background:var(--dna-ink-faint)}
.dna-canvas .tkb-col.is-doing .tkb-col-rail{background:var(--dna-chart)}
.dna-canvas .tkb-col.is-review .tkb-col-rail{background:repeating-linear-gradient(90deg,var(--dna-chart) 0 10px,var(--dna-chart-soft) 10px 20px)}
.dna-canvas .tkb-col.is-blocked .tkb-col-rail{background:var(--dna-down)}
.dna-canvas .tkb-col.is-done .tkb-col-rail{background:var(--dna-up)}
.dna-canvas .tkb-col-head{display:flex;align-items:center;gap:8px;padding:12px 14px 10px}
.dna-canvas .tkb-col-head i{width:8px;height:8px;border-radius:50%;flex:0 0 auto}
.dna-canvas .tkb-col.is-todo .tkb-col-head i{background:var(--dna-ink-faint)}
.dna-canvas .tkb-col.is-doing .tkb-col-head i{background:var(--dna-chart)}
.dna-canvas .tkb-col.is-review .tkb-col-head i{background:var(--dna-surface);border:2px solid var(--dna-chart)}
.dna-canvas .tkb-col.is-blocked .tkb-col-head i{background:var(--dna-down)}
.dna-canvas .tkb-col-head b{flex:0 1 auto;min-width:0;font-size:var(--dna-fs-small);font-weight:600;color:var(--dna-ink);letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dna-canvas .tkb-col-n{flex:none;font-size:var(--dna-fs-section);font-weight:400;color:var(--dna-ink-3);font-feature-settings:"tnum";line-height:1}
.dna-canvas .tkb-col-body{display:grid;gap:9px;padding:2px 12px 12px;align-content:start}
.dna-canvas .tkb-task[tabindex]{
  position:relative;display:grid;gap:8px;min-width:0;background:var(--dna-surface);border:1px solid var(--dna-border-strong);
  border-radius:10px;padding:11px 12px 10px;cursor:pointer;
  transition:box-shadow var(--dna-motion-base) ease,border-color var(--dna-motion-fast) ease;
}
.dna-canvas .tkb-task[tabindex]:hover{box-shadow:var(--tkb-card-shadow-hover);border-color:var(--dna-chart-soft)}
.dna-canvas .tkb-task.is-over{border-left:4px solid var(--dna-late)}
.dna-canvas .tkb-task-head{display:flex;align-items:flex-start;gap:8px;min-width:0}
.dna-canvas .tkb-task-title{flex:1 1 auto;min-width:0;font-size:var(--dna-fs-small);font-weight:600;color:var(--dna-ink);line-height:1.5}
.dna-canvas button.tkb-task-tgl{
  appearance:none;border:0;background:none;padding:3px;margin:-2px -4px 0 0;color:var(--dna-ink-faint);cursor:pointer;border-radius:6px;flex:0 0 auto;
  display:inline-grid;place-items:center;transition:background var(--dna-motion-fast) ease,color var(--dna-motion-fast) ease;
}
.dna-canvas button.tkb-task-tgl svg{width:12px;height:12px;stroke:currentColor;fill:none;transition:transform var(--dna-motion-base) var(--dna-ease-inout)}
.dna-canvas .tkb-task.is-open .tkb-task-tgl svg{transform:rotate(180deg)}
.dna-canvas button.tkb-task-tgl:hover{color:var(--dna-ink-2);background:var(--dna-surface-2)}
.dna-canvas .tkb-task-meta{display:flex;align-items:center;gap:7px;min-width:0}
.dna-canvas .tkb-task-meta small{font-size:11.5px;font-weight:500;color:var(--dna-ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.dna-canvas .tkb-task-meta .dna-due{margin-left:auto;flex:none;font-size:11.5px}
.dna-canvas .tkb-task[tabindex] .tkb-task-more{
  display:grid;grid-template-rows:0fr;opacity:0;margin-top:0;padding-top:0;border-top:1px solid transparent;
  transition:grid-template-rows var(--dna-motion-slow) var(--dna-ease-out),opacity var(--dna-motion-base) ease,margin-top var(--dna-motion-base) ease,padding-top var(--dna-motion-base) ease,border-top-color var(--dna-motion-base) ease;
}
.dna-canvas .tkb-task[tabindex]:hover .tkb-task-more,
.dna-canvas .tkb-task[tabindex]:focus-visible .tkb-task-more,
.dna-canvas .tkb-task[tabindex].is-open .tkb-task-more{grid-template-rows:1fr;opacity:1;margin-top:2px;padding-top:8px;border-top-color:var(--dna-hairline)}
.dna-canvas .tkb-task-more .in{overflow:hidden;min-height:0;min-width:0;display:grid;gap:8px}
.dna-canvas .tkb-sub{background:var(--dna-surface-2);border-radius:8px;padding:8px 10px;display:grid;gap:6px;min-width:0}
.dna-canvas .tkb-sub .h{display:flex;align-items:center;gap:8px;font-size:11.5px;font-weight:600;color:var(--dna-ink-2)}
.dna-canvas .tkb-sub .it{display:flex;align-items:flex-start;gap:8px;min-width:0}
.dna-canvas .tkb-sub .it i{width:10px;height:10px;border-radius:50%;flex:none;margin-top:4px;border:1.5px dashed var(--dna-ink-faint);background:var(--dna-surface)}
.dna-canvas .tkb-sub .it span{min-width:0;font-size:11.5px;font-weight:500;color:var(--dna-ink-2);line-height:1.6}
.dna-canvas .tkb-src{margin:0;font-size:11.5px;font-weight:500;color:var(--dna-ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dna-canvas .tkb-col-empty{border:1px dashed var(--dna-border-strong);border-radius:10px;padding:18px 10px;text-align:center;font-size:11.5px;font-weight:500;color:var(--dna-ink-faint)}
.dna-canvas .tkb-task.is-me{border-color:transparent;background:linear-gradient(var(--dna-surface),var(--dna-surface)) padding-box,var(--dna-grad-ring) border-box}
.dna-canvas .tkb-task.is-me.is-over{border-left-color:var(--dna-late)}
/* チャートの声（§6 .dna-linechart の軸・グリッド） */
.dna-canvas .axis{font-size:11.5px;font-weight:500;fill:var(--dna-ink-3);font-family:var(--dna-font)}
.dna-canvas .grid{stroke:var(--tp-grid);stroke-width:1}
.dna-canvas .tp-empty{margin:18px 0 0;font-size:var(--dna-fs-sub);font-weight:500;color:var(--dna-ink-3);text-align:center;padding:26px 0}

/* ============================================================
   5. page-local（数量の担体）
   ============================================================ */
/* 計器盤の骨格 */
.tp-grid-2{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);gap:var(--dna-gap);margin-top:var(--dna-gap);align-items:stretch}
.tp-grid-eq{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--dna-gap);margin-top:var(--dna-gap);align-items:stretch}
.tp-grid-4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--dna-gap);margin-top:var(--dna-gap)}
.tp-card-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;min-width:0}
.tp-card-head .right{margin-left:auto;display:inline-flex;align-items:center;gap:8px;flex-wrap:wrap}
.tp-gloss{margin:2px 0 0;font-size:var(--dna-fs-small);font-weight:400;color:var(--dna-ink-3);line-height:1.5}
.tp-card-title{margin:6px 0 0;font-size:var(--dna-fs-subject);font-weight:600;color:var(--dna-ink);line-height:1.4}
.tp-note{margin:10px 0 0;font-size:var(--dna-fs-small);font-weight:500;color:var(--dna-ink-3);line-height:1.6}
.tp-note b{font-weight:600;color:var(--dna-ink-2)}
.tp-link{font-size:var(--dna-fs-sub);font-weight:600;color:var(--dna-link);text-decoration:none;white-space:nowrap}
.tp-link:hover{text-decoration:underline}

/* 健全性 5観点の信号列 */
.tp-signals-card{padding:12px 18px;margin-top:14px}
.tp-signals-wrap{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.tp-signals-wrap .dna-metric-label{flex:none}
.tp-signals{display:flex;flex-wrap:wrap;gap:6px;flex:1 1 520px;min-width:0}
.tp-signal{
  flex:1 1 120px;min-width:0;display:flex;align-items:center;gap:9px;padding:8px 10px;border:1px solid transparent;border-radius:10px;
  background:transparent;font:inherit;color:var(--dna-ink);cursor:pointer;text-align:left;transition:background .15s ease;
}
.tp-signal:hover{background:var(--dna-surface-2)}
.tp-signal[aria-expanded="true"]{background:var(--dna-surface-2);border-color:var(--dna-border)}
.tp-signal .dot{width:14px;height:14px;border-radius:50%;flex:none;box-shadow:0 0 0 4px transparent}
.tp-signal.is-ok .dot{background:var(--dna-up);box-shadow:0 0 0 4px var(--dna-pill-up-bg)}
.tp-signal.is-warn .dot{background:var(--dna-pill-warn-ink);box-shadow:0 0 0 4px var(--dna-pill-warn-bg)}
.tp-signal.is-stop .dot{background:var(--dna-down);box-shadow:0 0 0 4px var(--dna-pill-down-bg)}
.tp-signal .t{display:grid;min-width:0;line-height:1.25}
.tp-signal .t b{font-size:var(--dna-fs-sub);font-weight:600;white-space:nowrap}
.tp-signal .t small{font-size:11.5px;font-weight:600;letter-spacing:.02em}
.tp-signal.is-ok .t small{color:var(--dna-pill-up-ink)}
.tp-signal.is-warn .t small{color:var(--dna-pill-warn-ink)}
.tp-signal.is-stop .t small{color:var(--dna-pill-down-ink)}
.tp-sig-why{margin:8px 0 0;padding:10px 12px;border-radius:10px;background:var(--dna-surface-2);font-size:var(--dna-fs-sub);font-weight:400;color:var(--dna-ink-2);line-height:1.6}
.tp-sig-why b{font-weight:600;color:var(--dna-ink)}

/* KGI 環ゲージ */
.tp-kgi{display:flex;flex-direction:column}
.tp-kgi-body{display:flex;align-items:center;gap:8px 18px;flex-wrap:wrap;margin-top:6px}
.tp-gauge{width:300px;max-width:100%;height:auto;display:block;flex:0 1 300px}
.tp-gauge .track{fill:none;stroke:var(--dna-progress-track);stroke-width:18;stroke-linecap:round}
.tp-gauge .ghost{fill:none;stroke:var(--dna-chart-soft);stroke-width:18;stroke-linecap:round;stroke-dasharray:1 8;opacity:.9}
.tp-gauge .fill{fill:none;stroke:url(#tp-grad);stroke-width:18;stroke-linecap:round}
.tp-gauge .tick{stroke:var(--dna-ink);stroke-width:2.5;stroke-linecap:round}
.tp-stop-a{stop-color:var(--dna-grad-a)}
.tp-stop-b{stop-color:var(--dna-grad-b)}
.tp-gauge .hero{font-size:40px;font-weight:650;letter-spacing:-.6px;fill:var(--dna-ink);font-family:var(--dna-font)}
.tp-gauge .hero-sub{font-size:15px;font-weight:600;fill:var(--dna-ink-2);font-family:var(--dna-font)}
.tp-gauge .hero-top{font-size:12.5px;font-weight:600;fill:var(--dna-ink-3);font-family:var(--dna-font)}
.tp-gauge .lbl{font-size:11.5px;font-weight:600;fill:var(--dna-ink-3);font-family:var(--dna-font)}
.tp-gauge .lbl.strong{fill:var(--dna-ink);font-weight:600}
.tp-legend{flex:1 1 220px;min-width:0;display:grid;gap:2px;align-content:center}
.tp-legend .row{display:grid;grid-template-columns:22px minmax(0,1fr) auto;align-items:center;gap:8px;min-height:32px;padding:2px 0;border-bottom:1px solid var(--dna-hairline)}
.tp-legend .row:last-child{border-bottom:0}
.tp-legend .sw{width:14px;height:14px;border-radius:4px;justify-self:center}
.tp-legend .sw.grad{background:var(--dna-grad-h)}
.tp-legend .sw.tick{width:3px;height:16px;border-radius:2px;background:var(--dna-ink)}
.tp-legend .sw.ghost{background:repeating-linear-gradient(90deg,var(--dna-chart-soft) 0 3px,transparent 3px 6px);height:8px;border-radius:4px}
.tp-legend .sw.goal{background:transparent;border:2px solid var(--dna-ink-faint);border-radius:50%;width:12px;height:12px}
.tp-legend .k{font-size:var(--dna-fs-sub);font-weight:500;color:var(--dna-ink-2);min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tp-legend .k small{display:block;font-size:11.5px;font-weight:500;color:var(--dna-ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tp-legend .v{font-size:var(--dna-fs-section);font-weight:600;color:var(--dna-ink);white-space:nowrap;display:inline-flex;align-items:baseline;gap:6px;font-feature-settings:"tnum"}
.tp-legend .v .u{font-size:12.5px;font-weight:600;color:var(--dna-ink-2)}
.tp-bn{margin-top:10px;padding-top:10px;border-top:1px solid var(--dna-hairline);display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:var(--dna-fs-sub);font-weight:500;color:var(--dna-ink-2)}
.tp-bn .n{font-weight:600;color:var(--dna-ink)}
.tp-bn .pace{display:inline-flex;align-items:baseline;gap:4px;font-feature-settings:"tnum"}
.tp-bn .pace b{font-size:var(--dna-fs-section);font-weight:600;color:var(--dna-ink)}
.tp-bn .pace.need b{color:var(--dna-pill-info-ink)}
.tp-bn .arrow{color:var(--dna-ink-faint)}

/* 決めどころ（着地比較の棒） */
.tp-decide{display:grid;gap:4px;margin-top:8px}
.tp-decide-row{display:grid;grid-template-columns:26px minmax(0,1fr);gap:4px 10px;padding:10px 0;border-bottom:1px solid var(--dna-hairline)}
.tp-decide-row:last-child{border-bottom:0}
.tp-decide-row .no{width:24px;height:24px;border-radius:50%;background:var(--dna-pill-info-bg);color:var(--dna-pill-info-ink);font-size:12.5px;font-weight:600;display:grid;place-items:center;margin-top:1px}
.tp-decide-row .t{min-width:0}
.tp-decide-row .t b{display:block;font-size:var(--dna-fs-body);font-weight:600;color:var(--dna-ink);line-height:1.45}
.tp-decide-row .t .who{display:inline-flex;align-items:center;gap:6px;margin-top:4px;font-size:12.5px;font-weight:500;color:var(--dna-ink-3)}
.tp-land{grid-column:2;display:grid;grid-template-columns:auto minmax(60px,1fr) auto;align-items:center;gap:10px;margin-top:6px}
.tp-land .lbl{font-size:11.5px;font-weight:600;color:var(--dna-ink-3);white-space:nowrap}
.tp-land u{text-decoration:none;display:block;height:8px;border-radius:4px;background:var(--dna-progress-track);overflow:hidden;position:relative}
.tp-land u i{display:block;height:100%;border-radius:4px;background:var(--dna-grad-h)}
.tp-land u.base i{background:var(--dna-ink-faint)}
.tp-land b{font-size:var(--dna-fs-section);font-weight:600;color:var(--dna-ink);white-space:nowrap;font-feature-settings:"tnum"}
.tp-land b small{font-size:12.5px;font-weight:600;color:var(--dna-ink-2);margin-left:2px}
.tp-land.base{grid-column:1 / -1;grid-template-columns:auto minmax(60px,1fr) auto;margin-top:2px;padding-top:8px}
.tp-land.base .lbl{color:var(--dna-ink-2)}
.tp-land .goalmark{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--dna-ink-2);right:0}

/* KPI ミニ推移（目標線つき） */
.tp-kpi{display:flex;flex-direction:column}
.tp-kpi-head{display:flex;align-items:center;gap:8px;min-width:0}
.tp-kpi-head .dna-metric-label{min-width:0}
.tp-kpi-head .dna-metric-label .u{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tp-kpi-head .dna-tag{margin-left:auto;flex:none;font-size:11.5px;padding:2.5px 8px}
.tp-kpi .tp-gloss{white-space:normal;line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.2em}
.tp-mini{width:92px;height:46px;flex:none;display:block}
.tp-mini .bar{fill:var(--tp-minibar)}
.tp-mini .bar.hot{fill:var(--dna-chart-soft)}
.tp-mini .goal{stroke:var(--dna-chart);stroke-width:1.5;stroke-dasharray:2 3}
.tp-mini .goal-t{font-size:11px;font-weight:600;fill:var(--dna-chart);font-family:var(--dna-font)}
.tp-kpi-foot{margin:8px 0 0;font-size:var(--dna-fs-small);font-weight:500;color:var(--dna-ink-3);line-height:1.6;display:flex;flex-wrap:wrap;gap:0 6px}
.tp-kpi-foot b{font-weight:600;color:var(--dna-ink-2)}
.tp-kpi-foot .asof{margin-left:auto;white-space:nowrap}

/* フェーズの帯（今日線） */
.tp-band-wrap{margin-top:34px;position:relative}
.tp-band{position:relative;height:40px;border-radius:999px;background:var(--dna-progress-track)}
.tp-phase{
  position:absolute;top:0;bottom:0;display:flex;align-items:center;gap:6px;padding:0 12px;min-width:0;
  font-size:12.5px;font-weight:600;color:var(--dna-ink-2);white-space:nowrap;overflow:hidden;
}
.tp-phase .no{flex:none;width:18px;height:18px;border-radius:50%;background:var(--dna-surface);color:var(--dna-ink-2);display:grid;place-items:center;font-size:11px;font-weight:600;box-shadow:0 1px 2px rgba(16,18,26,.12)}
.tp-phase .nm{overflow:hidden;text-overflow:ellipsis;min-width:0}
.tp-phase.is-past{background:var(--dna-chart-band);color:var(--dna-ink-2)}
.tp-phase.is-now{background:var(--dna-grad-h);color:#fff}
.tp-phase.is-now .no{color:var(--dna-grad-a)}
.tp-phase.is-next{background:transparent;box-shadow:inset 0 0 0 1px var(--dna-border-strong)}
.tp-phase:first-child{border-radius:999px 0 0 999px}
.tp-phase.is-last{border-radius:0 999px 999px 0}
.tp-today{position:absolute;top:-8px;bottom:-14px;width:2px;background:var(--dna-chart);transform:translateX(-1px);z-index:2}
.tp-today-tag{
  position:absolute;top:-30px;transform:translateX(-50%);font-size:11.5px;font-weight:650;padding:3px 10px;border-radius:999px;
  background:var(--dna-pill-info-bg);color:var(--dna-pill-info-ink);white-space:nowrap;z-index:3;line-height:1.3;
}
.tp-gate{position:absolute;top:100%;margin-top:8px;transform:translateX(-50%);display:grid;justify-items:center;gap:3px;z-index:1}
.tp-gate i{width:12px;height:12px;border-radius:50%;background:var(--dna-surface);border:2px solid var(--dna-ink-faint);display:grid;place-items:center}
.tp-gate.is-done i{background:var(--dna-up);border-color:var(--dna-up)}
.tp-gate i svg{width:8px;height:8px;stroke:#fff;fill:none}
.tp-gate small{font-size:11.5px;font-weight:500;color:var(--dna-ink-3);white-space:nowrap;font-feature-settings:"tnum"}
.tp-gate.is-done small{color:var(--dna-pill-up-ink);font-weight:600}
.tp-phaselist{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px 14px;margin-top:44px}
.tp-phaselist .ph{display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 8px;min-width:0;font-size:12.5px;line-height:1.45}
.tp-phaselist .ph .no{grid-row:1 / span 3;width:20px;height:20px;border-radius:50%;background:var(--dna-surface-2);border:1px solid var(--dna-border);color:var(--dna-ink-2);display:grid;place-items:center;font-size:11px;font-weight:600;margin-top:1px}
.tp-phaselist .ph.is-now .no{background:var(--dna-pill-info-bg);border-color:transparent;color:var(--dna-pill-info-ink)}
.tp-phaselist .ph .nm{font-size:var(--dna-fs-sub);font-weight:600;color:var(--dna-ink);min-width:0}
.tp-phaselist .ph .dt{font-weight:500;color:var(--dna-ink-3);font-feature-settings:"tnum"}
.tp-phaselist .ph .gt{font-weight:400;color:var(--dna-ink-2);min-width:0;display:flex;align-items:flex-start;gap:6px;flex-wrap:wrap}
.tp-phaselist .ph .gt .dna-status{font-size:11px;padding:2.5px 8px;flex:none}

/* 積み上げの帯（タスク・WP・稼働） */
.tp-stack{display:flex;height:14px;border-radius:999px;background:var(--dna-progress-track);overflow:hidden;position:relative}
.tp-stack i{display:block;height:100%}
.tp-stack .s-todo{background:var(--dna-control-off)}
.tp-stack .s-doing{background:var(--dna-chart)}
.tp-stack .s-review{background:var(--dna-chart-soft)}
.tp-stack .s-blocked{background:var(--dna-down)}
.tp-stack .s-done{background:var(--dna-grad-h)}
.tp-stack .plan{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--dna-ink-2)}
.tp-stack-legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:8px;font-size:12.5px;font-weight:500;color:var(--dna-ink-2)}
.tp-stack-legend span{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.tp-stack-legend i{width:8px;height:8px;border-radius:50%;flex:none}
.tp-stack-legend b{font-weight:600;color:var(--dna-ink);font-feature-settings:"tnum"}
.tp-stack-legend .late{color:var(--dna-late)}
.tp-stack-legend .late b{color:var(--dna-late)}
.tp-stack-legend .late i{background:var(--dna-late)}
.tp-stackrow{margin-top:14px}
.tp-stackrow .h{display:flex;align-items:baseline;gap:8px;margin-bottom:6px;font-size:var(--dna-fs-sub);font-weight:600;color:var(--dna-ink-2)}
.tp-stackrow .h b{font-size:var(--dna-fs-section);font-weight:600;color:var(--dna-ink);font-feature-settings:"tnum"}
.tp-stackrow .h small{font-size:12.5px;font-weight:500;color:var(--dna-ink-3);margin-left:auto;white-space:nowrap}
.tp-rate{display:flex;align-items:center;gap:10px;margin-top:6px}
.tp-rate u{text-decoration:none;display:block;flex:1 1 auto;height:8px;border-radius:4px;background:var(--dna-progress-track);overflow:hidden}
.tp-rate u i{display:block;height:100%;border-radius:4px;background:var(--dna-grad-h)}
.tp-rate b{flex:none;font-size:var(--dna-fs-section);font-weight:600;color:var(--dna-ink);font-feature-settings:"tnum"}
.tp-rate small{flex:none;font-size:12.5px;font-weight:500;color:var(--dna-ink-3);white-space:nowrap}

/* リスク・課題 */
.tp-ri{display:grid;margin-top:6px}
.tp-ri-row{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 10px;padding:10px 0;border-bottom:1px solid var(--dna-hairline);align-items:start}
.tp-ri-row:last-child{border-bottom:0}
.tp-ri-row .st{display:grid;gap:4px;justify-items:start}
.tp-ri-row .st small{font-size:11.5px;font-weight:600;color:var(--dna-ink-3);letter-spacing:.02em;padding-left:2px}
.tp-ri-row .tx{font-size:var(--dna-fs-sub);font-weight:500;color:var(--dna-ink);line-height:1.55;min-width:0}
.tp-ri-row .meta{grid-column:2;display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12.5px;font-weight:500;color:var(--dna-ink-3)}
.tp-ri-row .meta b{font-weight:600;color:var(--dna-ink-2)}
.dna-canvas .tp-col2{grid-column:2}
.dna-canvas .tp-mt0{margin-top:0}
.tp-ri-row .meta .dna-due{font-size:12.5px}

/* この人の今週（見る人の帯） */
.tp-mpanel{margin-top:14px;padding:16px 22px}
.tp-mpanel .ph{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.tp-mpanel .ph .t{min-width:0}
.tp-mpanel .ph .n{display:block;font-size:var(--dna-fs-subject);font-weight:600;color:var(--dna-ink)}
.tp-mpanel .ph .r{display:block;font-size:12.5px;font-weight:400;color:var(--dna-ink-3)}
.tp-mpanel .ph .right{margin-left:auto;display:inline-flex;align-items:center;gap:8px;flex-wrap:wrap}
.tp-mpanel-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px 22px;margin-top:12px;padding-top:12px;border-top:1px solid var(--dna-hairline)}
.tp-blk{min-width:0}
.tp-blk .k{display:block;font-size:11.5px;font-weight:600;color:var(--dna-ink-3);letter-spacing:.04em;margin-bottom:6px}
.tp-blk .big{display:inline-flex;align-items:baseline;gap:4px;font-size:var(--dna-fs-section);font-weight:600;color:var(--dna-ink);font-feature-settings:"tnum"}
.tp-blk .big small{font-size:12.5px;font-weight:500;color:var(--dna-ink-3)}
.tp-blk .big .late{font-size:12.5px;font-weight:600;color:var(--dna-late);margin-left:6px}
.tp-blk .tags{display:flex;flex-wrap:wrap;gap:5px}
.tp-blk .tags .dna-tag{font-size:11.5px;padding:2.5px 8px}
.tp-blk .tags .more{font-size:11.5px;font-weight:500;color:var(--dna-ink-3);align-self:center}
.tp-kdi{display:grid;gap:5px}
.tp-kdi .r{display:grid;grid-template-columns:minmax(0,1fr) 72px auto;align-items:center;gap:8px;font-size:12.5px}
.tp-kdi .r .nm{font-weight:500;color:var(--dna-ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.tp-kdi .r u{text-decoration:none;display:block;height:6px;border-radius:3px;background:var(--dna-progress-track);overflow:hidden}
.tp-kdi .r u i{display:block;height:100%;border-radius:3px;background:var(--dna-grad-h)}
.tp-kdi .r u i.short{background:var(--dna-pill-warn-ink)}
.tp-kdi .r b{font-weight:600;color:var(--dna-ink);white-space:nowrap;font-feature-settings:"tnum"}
.tp-kdi .r b small{font-weight:500;color:var(--dna-ink-3)}
.tp-mini-list{display:grid;gap:4px;font-size:12.5px}
.tp-mini-list .r{display:flex;align-items:center;gap:8px;min-width:0}
.tp-mini-list .r .tx{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--dna-ink);font-weight:500}
.tp-mini-list .r .dna-status{font-size:11px;padding:2.5px 8px;flex:none;margin-left:auto}
.tp-mini-list .r .dna-due{font-size:12.5px;flex:none}

/* メンバーの人カード */
.tp-people{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--dna-gap);margin-top:12px}
.tp-person{position:relative}
.tp-person.is-me{border-color:transparent;background:linear-gradient(var(--dna-surface),var(--dna-surface)) padding-box,var(--dna-grad-ring) border-box}
.tp-person .ph{display:flex;align-items:center;gap:12px;min-width:0}
.tp-person .ph .t{min-width:0;flex:1 1 auto}
.tp-person .ph .n{display:block;font-size:var(--dna-fs-subject);font-weight:600;color:var(--dna-ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tp-person .ph .r{display:block;margin-top:1px;font-size:13.5px;font-weight:400;color:var(--dna-ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tp-person .ph .right{flex:none;display:inline-flex;gap:6px;align-items:center}
.tp-person-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 22px;margin-top:14px;padding-top:12px;border-top:1px solid var(--dna-hairline)}
.tp-person-grid .wide{grid-column:1 / -1}
.tp-load{width:100%;height:56px;display:block}
.tp-load .bar{fill:var(--tp-minibar)}
.tp-load .bar.hot{fill:url(#tp-grad-v)}
.tp-load .lb{font-size:11px;font-weight:500;fill:var(--dna-ink-3);font-family:var(--dna-font)}
.tp-load .lb.hot{fill:var(--dna-ink);font-weight:600}
.tp-load .pc{font-size:11px;font-weight:600;fill:var(--dna-ink-2);font-family:var(--dna-font)}
.tp-next{display:flex;align-items:center;gap:10px;min-width:0;font-size:var(--dna-fs-sub)}
.tp-next .dna-due{flex:none;font-size:13.5px;font-weight:600}
.tp-next .tx{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--dna-ink-2);font-weight:500}
.tp-members-sum{display:flex;align-items:center;gap:14px;flex-wrap:wrap;font-size:var(--dna-fs-sub);font-weight:500;color:var(--dna-ink-2)}
.tp-members-sum b{font-weight:600;color:var(--dna-ink);font-feature-settings:"tnum"}
.tp-members-sum .late{color:var(--dna-late)}

/* 会議の流れ（前回 → 今週 → 次回） */
.tp-flow{display:grid;grid-template-columns:minmax(0,1fr) 22px minmax(0,1fr) 22px minmax(0,1fr);gap:8px;align-items:stretch;margin-top:12px}
.tp-flow-arrow{display:grid;place-items:center;color:var(--dna-ink-faint)}
.tp-flow-arrow svg{width:18px;height:18px;stroke:currentColor;fill:none}
.tp-mtg{display:flex;flex-direction:column;gap:12px;padding:18px 20px 20px}
.tp-mtg-head{display:flex;align-items:flex-start;gap:10px;flex-wrap:wrap}
.tp-mtg-head .stage{font-size:11.5px;font-weight:700;letter-spacing:.24em;text-transform:uppercase;color:var(--dna-ink-3);line-height:1;padding-top:3px;flex:none}
.tp-mtg-head .stage.now{color:var(--dna-pill-info-ink)}
.tp-mtg-head .d{min-width:0}
.tp-mtg-head .d b{display:block;font-size:var(--dna-fs-section);font-weight:600;color:var(--dna-ink);line-height:1.35}
.tp-mtg-head .d small{display:block;margin-top:2px;font-size:12.5px;font-weight:500;color:var(--dna-ink-3)}
.tp-mtg .sec{padding-top:10px;border-top:1px solid var(--dna-hairline)}
.tp-mtg .sec .h{display:flex;align-items:baseline;gap:8px;font-size:var(--dna-fs-sub);font-weight:600;color:var(--dna-ink-2);margin-bottom:6px}
.tp-mtg .sec .h b{font-size:var(--dna-fs-section);font-weight:600;color:var(--dna-ink);font-feature-settings:"tnum"}
.tp-mtg .sec .h small{margin-left:auto;font-size:12.5px;font-weight:500;color:var(--dna-ink-3);white-space:nowrap}
.tp-check{display:grid;gap:2px}
.tp-check .r{display:grid;grid-template-columns:18px minmax(0,1fr) auto;align-items:start;gap:8px;min-height:32px;padding:4px 4px;border-radius:8px}
.tp-check .r .ck{margin-top:2px}
.tp-check .r .right{padding-top:1px}
.tp-check .r.is-me{background:var(--dna-pill-info-bg)}
.tp-check .r .ck{width:16px;height:16px;border-radius:50%;display:grid;place-items:center;background:var(--dna-surface);border:1.5px solid var(--dna-ink-faint)}
.tp-check .r .ck.on{background:var(--dna-up);border-color:var(--dna-up)}
.tp-check .r .ck svg{width:10px;height:10px;stroke:#fff;fill:none}
.tp-check .r .tx{min-width:0;font-size:13.5px;font-weight:500;color:var(--dna-ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tp-check .r .tx small{display:block;font-size:11.5px;font-weight:500;color:var(--dna-ink-3);white-space:normal;line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tp-check .r .right{display:inline-flex;align-items:center;gap:8px;flex:none}
.tp-check .r .dna-status{font-size:11px;padding:2.5px 8px}
.tp-check .r .dna-due{font-size:12.5px}
.tp-pills{display:flex;flex-wrap:wrap;gap:6px}
.tp-pills .dna-tag{white-space:normal;text-align:left;line-height:1.5;max-width:100%}
.dna-canvas .dna-tag.tp-wp{display:inline-flex;align-items:baseline;gap:5px;max-width:260px}
.dna-canvas .dna-tag.tp-wp b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.dna-canvas .dna-tag.tp-wp small{font-size:10.5px;font-weight:700;opacity:.72;flex:none}
.dna-canvas .dna-tag.tp-wp i.st{font-style:normal;font-size:10.5px;font-weight:600;opacity:.66;flex:none}
.tp-before{display:grid;gap:6px}
.tp-before .r{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px;align-items:baseline;font-size:13.5px;font-weight:500;color:var(--dna-ink-2);line-height:1.5}
.tp-before .r .w{font-size:11.5px;font-weight:700;color:var(--dna-pill-info-ink);background:var(--dna-pill-info-bg);border-radius:6px;padding:2px 8px;white-space:nowrap}
.tp-agenda{display:grid;gap:2px;counter-reset:ag}
.tp-agenda .r{display:grid;grid-template-columns:22px minmax(0,1fr) auto;align-items:start;gap:8px;padding:5px 4px;border-radius:8px;font-size:13.5px;font-weight:500;color:var(--dna-ink);line-height:1.5}
.tp-agenda .r .no{width:20px;height:20px;border-radius:50%;background:var(--dna-surface-2);border:1px solid var(--dna-border);color:var(--dna-ink-2);display:grid;place-items:center;font-size:11px;font-weight:600;margin-top:1px}
.tp-agenda .r.is-decide{background:var(--dna-pill-info-bg)}
.tp-agenda .r.is-decide .no{background:var(--dna-surface);border-color:transparent;color:var(--dna-pill-info-ink)}
.tp-agenda .r .dna-tag{font-size:11px;padding:2.5px 8px;margin-top:1px}
.tp-faces{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.tp-faces .tp-who{font-size:12.5px;padding:2px 8px 2px 3px;border-radius:999px}
.tp-faces .tp-who.is-me{background:var(--dna-pill-info-bg)}
.tp-mtg-meta{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12.5px;font-weight:500;color:var(--dna-ink-3)}
.tp-mtg-meta b{font-weight:600;color:var(--dna-ink-2)}
.tp-dec{display:grid;gap:2px}
.tp-dec .r{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;padding:10px 0;border-bottom:1px solid var(--dna-hairline);align-items:start}
.tp-dec .r:last-child{border-bottom:0}
.tp-dec .r .dt{font-size:12.5px;font-weight:600;color:var(--dna-ink-3);font-feature-settings:"tnum";white-space:nowrap;padding-top:2px}
.tp-dec .r .tx{font-size:var(--dna-fs-body);font-weight:600;color:var(--dna-ink);line-height:1.5;min-width:0}
.tp-dec .r .id{font-size:11.5px;font-weight:600;color:var(--dna-ink-3);letter-spacing:.02em;margin-left:8px}
.tp-dec .r .tp-fold{grid-column:2;margin-top:0}

/* ============================================================
   6. レスポンシブ（横はみ出しゼロ）
   ============================================================ */
@media (max-width:1100px){
  .tp-grid-4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .tp-mpanel-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:900px){
  .tp-grid-2,.tp-grid-eq{grid-template-columns:minmax(0,1fr)}
  .tp-people{grid-template-columns:minmax(0,1fr)}
  .tp-flow{grid-template-columns:minmax(0,1fr)}
  .tp-flow-arrow svg{transform:rotate(90deg)}
  .tp-phaselist{grid-template-columns:repeat(2,minmax(0,1fr))}
  :root{--tkb-lane-width:248px}
}
@media (max-width:600px){
  .dna-canvas{padding:14px 14px 60px}
  .tp-grid-4{grid-template-columns:minmax(0,1fr)}
  .tp-mpanel-grid,.tp-person-grid,.tp-phaselist{grid-template-columns:minmax(0,1fr)}
  .tp-gauge{flex-basis:100%;width:100%}
  .tp-phase .nm{display:none}
  .tp-phase{padding:0 6px}
  .tp-scope{margin-left:0;width:100%}
  .tp-select{max-width:100%;flex:1 1 auto}
  .tp-signal{flex-basis:calc(50% - 6px)}
  .tp-kpi-foot .asof{margin-left:0;width:100%}
  .tp-ri-row{grid-template-columns:minmax(0,1fr)}
  .tp-ri-row > *,.tp-ri-row .meta{grid-column:1}
  .dna-canvas .tp-col2{grid-column:1}
